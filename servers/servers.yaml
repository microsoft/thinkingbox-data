use_internal_servers: true
servers:
  # THINKINGBOX INTERNAL SERVERS
  airline_tau_bench:
    type: mcp-process
    command: ["{python}", "-m", "thinkingbox_tools.mcp_airline_tau_bench"]
  email_system:
    type: mcp-process
    command: ["{python}", "-m", "thinkingbox_tools.mcp_email_system"]
  ms_store:
    type: mcp-process
    command: ["{python}", "-m", "thinkingbox_tools.mcp_ms_store"]
  online_banking:
    type: mcp-process
    command: ["{python}", "-m", "thinkingbox_tools.mcp_online_banking"]

  # SANDBOX SERVERS
  sandbox_external_retail:
    type: mcp-process
    command: ["{python}", "-m", "sandbox_servers.mcp_sandbox_external_retail"]
    env:
      TYPESENSE_API_KEY: "Fake"
  sandbox_auto_insurance:
    type: mcp-process
    command: ["{python}", "-m", "sandbox_servers.mcp_sandbox_auto_insurance"]
    env:
      TYPESENSE_API_KEY: "Fake"
  sandbox_consulting:
    type: mcp-process
    command: ["{python}", "-m", "sandbox_servers.mcp_sandbox_consulting"]
    env:
      TYPESENSE_API_KEY: "Fake"
  external_booking_v1:
    type: mcp-process
    command: ["{python}", "-m", "sandbox_servers.mcp_external_booking_v1"]
    env:
      TYPESENSE_API_KEY: "Fake"
  sandbox_neobank_support_v1:
    type: mcp-process
    command: ["{python}", "-m", "sandbox_servers.mcp_sandbox_neobank_support_v1"]
    env:
      TYPESENSE_API_KEY: "Fake"
