use_internal_servers: true
servers:
  # THINKINGBOX INTERNAL SERVERS
  airline_tau_bench:
    type: mcp-process
    command: ["{python}", "-m", "thinkingbox_tools.mcp_airline_tau_bench"]
  email_system:
    type: mcp-process
    command: ["{python}", "-m", "thinkingbox_tools.mcp_email_system"]
  ms_store:
    type: mcp-process
    command: ["{python}", "-m", "thinkingbox_tools.mcp_ms_store"]
  online_banking:
    type: mcp-process
    command: ["{python}", "-m", "thinkingbox_tools.mcp_online_banking"]
  # Sandbox code interpreter (Pyodide-based).
  #
  # SECURITY: Pyodide is not a privilege boundary.  Code executed here can reach
  # the Node host, the host filesystem, process execution, and this process's
  # environment.  The server refuses to start without the opt-in below.  Set it
  # only where the executed code is trusted and first-party, and keep secrets
  # out of this process's environment.  See docs/sandbox_code_interpreter.md.
  sandbox:
    type: mcp-process
    command: ["{python}", "-m", "thinkingbox_tools.mcp_sandbox"]
    env:
      THINKINGBOX_SANDBOX_ALLOW_UNCONFINED: "1"

  # TB BUSINESS OPS SERVERS 202606
  sandbox_external_retail:
    type: mcp-process
    command: ["{python}", "-m", "tb_business_ops_servers_202606.mcp_sandbox_external_retail"]
    env:
      TYPESENSE_API_KEY: "Fake"
  sandbox_auto_insurance:
    type: mcp-process
    command: ["{python}", "-m", "tb_business_ops_servers_202606.mcp_sandbox_auto_insurance"]
    env:
      TYPESENSE_API_KEY: "Fake"
  sandbox_consulting:
    type: mcp-process
    command: ["{python}", "-m", "tb_business_ops_servers_202606.mcp_sandbox_consulting"]
    env:
      TYPESENSE_API_KEY: "Fake"
  external_booking_v1:
    type: mcp-process
    command: ["{python}", "-m", "tb_business_ops_servers_202606.mcp_external_booking_v1"]
    env:
      TYPESENSE_API_KEY: "Fake"
  sandbox_neobank_support_v1:
    type: mcp-process
    command: ["{python}", "-m", "tb_business_ops_servers_202606.mcp_sandbox_neobank_support_v1"]
    env:
      TYPESENSE_API_KEY: "Fake"
