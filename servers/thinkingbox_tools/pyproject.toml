[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkingbox_tools"
version = "0.0.1"
description = "Thinkingbox MCP servers"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4.3,<4",
    "httpx",
    "pydantic",
    "python-dateutil",
    "sqlparse",
    "typesense",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "trio>=0.22.0",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["thinkingbox_tools*"]

[tool.setuptools.package-data]
thinkingbox_tools = [
    # Sandbox worker assets — required at runtime by mcp_sandbox.  node_modules/
    # and wheels/ are populated by `npm install` post-install and are NOT
    # packaged; see docs/sandbox_code_interpreter.md.
    "toolslib/sandbox/*.mjs",
    "toolslib/sandbox/package.json",
    "toolslib/sandbox/package-lock.json",
    "toolslib/sandbox/scripts/*.mjs",
]

[tool.pytest.ini_options]
markers = [
    "typesense: tests that require a running typesense server",
]