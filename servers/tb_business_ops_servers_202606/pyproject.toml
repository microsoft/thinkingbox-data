[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tb_business_ops_servers_202606"
version = "0.1.0"
description = "ThinkingBox business operations MCP servers"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4.3,<4",
    "pydantic",
    "odata-query>=0.9.0",
    "typesense",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "trio>=0.22.0",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["tb_business_ops_servers_202606*"]

[tool.pytest.ini_options]
markers = [
    "tb_mcp_start: tests that require a running the MCP session handler server",
]
