world_state:
  external_booking_v1:
    sources:
      - name: billing_payment_issues.md
        snippets:
          - '### 4.3 Billing & Payment Issues\n\n#### 4.3.1 Payment Failed\n\nWhen customer reports payment failure:\n\n1. Check payment status for the booking\n2. **If payment_status = `failed`:**\n   - Use update payment method tool to register the new payment method in the system\n   - Inform customer that their payment method has been updated and they can now retry their booking payment through the checkout flow\n   - Set request_type_detail = `billing-inquiry`\n   - If payment method is successfully updated, set ticket status = `solved` and resolution_action = `information-provided`\n3. **If payment_status = `successful` but customer disputes:**\n   - Retrieve full transaction history\n   - Provide transaction_id and payment details to customer\n   - If discrepancy confirmed, initiate dispute investigation\n\n**Payment Method Token Format:** When customer provides card last 4 digits (e.g., "card ending in 4521"), construct the payment method token as `tok_card_ending_XXXX` where XXXX is the last 4 digits.\n\n#### 4.3.2 Charge Disputes\n\nWhen customer disputes a charge:\n\n1. Retrieve complete transaction history for the booking\n2. Identify all charges and their purposes\n3. Explain each line item to customer\n4. **If customer believes charge is erroneous:**\n   - Create dispute case in payment system\n   - Provide dispute_case_id to customer for tracking\n   - Set request_type_detail = `billing-inquiry`\n   - Set resolution_action = `information-provided` (pending investigation)\n   - Set ticket status = `solved` after creating the dispute case and providing the dispute_case_id to the customer\n5. **If the dispute appears to be caused by a clear technical error that you can confirm using available system logs or payment records** (for example, an obvious duplicate charge for the same booking, a confirmed mismatch between the price shown in the booking flow and the amount charged, or a documented system malfunction), you may apply the System Error Exception (Section 4.2.3) instead of opening a separate dispute case. In these situations, process a 100% refund of the booking_value with the service fee waived, set escalation_reason = `system-error`, set resolution_action = `refund-full`, and document the specific technical evidence you relied on in the ticket description. For billing overcharges (amount charged > booking_value), see also Section 4.3.5.\n\n**Note:** The Section 4.9.2 escalation threshold for billing disputes (booking_value >$500) does NOT apply to charge disputes where the agent creates a dispute case per Step 4 above.\n\n**Post-stay billing complaints:** If the charge dispute is reported after checkout (booking_status = `checked_out`) and involves disputed facts requiring hotel verification (e.g., unauthorized minibar charges, incorrect hotel charges), use request_type_detail = `post-stay-issue` and follow Section 4.4 Post-Stay Issues procedures instead of creating a payment dispute case.\n\n**Customer-Provided Evidence:** When a customer provides credible documentary evidence of a pricing discrepancy (e.g., screenshot of checkout page showing a different price than charged, confirmation email with different amount), and the booking shows no modification_history that would explain the difference, the agent may treat this as sufficient evidence of a system error. Process the price correction per Section 4.3.5 (refund the difference). Document the customer''s evidence in the ticket description.\n\n#### 4.3.3 Invoice & Receipt Requests\n\n**For B2C Customers:**\n- Generate standard receipt (invoice_type = "receipt")\n- Provide download URL to customer\n\n**For Corporate Account Holders:**\n- Generate corporate invoice format (invoice_type = "invoice")\n- Corporate invoice includes:\n  - Company billing information\n  - Payment terms based on account_tier (Net 30/45/60)\n  - Expense codes and detailed line items\n- Provide download URL to customer\n\nSet request_type_detail = `billing-inquiry`\nSet resolution_action = `information-provided`\n\n#### 4.3.4 Refund Status Inquiries\n\nWhen customer asks about pending refund:\n\n1. Check payment status and transaction history for booking\n2. **If refund transaction exists:**\n   - Provide transaction_id\n   - Confirm timeline: "3-5 business days for processing, then 5-10 business days to appear on your card"\n3. **If no refund transaction:**\n   - Investigate why refund was not processed\n   - Take appropriate action per cancellation policy\n\nSet request_type_detail = `request-refund`\nSet resolution_action = `information-provided`\n\n#### 4.3.5 Billing Overcharge Corrections\n\nWhen transaction amount exceeds booking_value with no documented modifications, special request fees, or incidental charges:\n\n1. Calculate overcharge_amount = transaction_amount - booking_value\n2. Process refund for overcharge_amount only (NOT full booking_value)\n3. If reported ≤48 hours after checkout: Add 10% courtesy credit on the corrected amount\n4. If reported >48 hours after checkout: No courtesy credit\n5. Set escalation_reason = `system-error`\n6. Set resolution_action = `refund-partial`\n7. Set request_type_detail = `billing-inquiry`\n8. Set ticket status = `solved`\n\n**EXCEPTION to Section 4.9.2 escalation rule:** For billing discrepancies where system records clearly show a mismatch between booking_value and transaction amount with no documented modifications or additional charges, process the correction directly without hotel escalation, even if booking_value exceeds $500. This is a verifiable system error, not a disputed fact requiring hotel verification.\n\n---'
      - name: booking_modifications.md
        snippets:
          - '### 4.1 Booking Modifications\n\n#### 4.1.1 Modification Types\n\n| Modification Type | request_type_detail Value |\n|-------------------|---------------------------|\n| Change check-in and/or check-out dates | `modify-dates` |\n| Change number of adults and/or children | `modify-guests` |\n| Change room category | `modify-room-type` |\n| Change meal plan | `modify-board-type` |\n| Add special requests (accessibility, pets, etc.) | `add-special-request` |\n\n**Room Types (room_type enum):**\n`standard_room`, `deluxe_room`, `suite`, `executive_suite`, `presidential_suite`, `family_room`, `accessible_room`\n\n**Board Types (board_type enum):**\n`without_breakfast`, `with_breakfast`, `half_board`, `full_board`, `all_inclusive`\n\n#### 4.1.2 Modification Eligibility\n\n**Prerequisites (all must be true):**\n- Booking exists in system\n- booking_status = `confirmed`\n- Requested room/date combination is available at hotel\n\n**Modifications NOT permitted when:**\n- booking_status is `cancelled`, `checked_in`, or `checked_out`\n- Requested configuration is unavailable\n- Hotel partner_tier = `budget` AND time until check-in <24 hours\n\n**Handling ineligible modification requests:** When a modification request is received for a booking with status `cancelled`, `checked_in`, or `checked_out`:\n1. Inform the customer that modifications are only available for bookings with status `confirmed`\n2. For `checked_in` bookings, advise the customer to speak directly with the hotel front desk to arrange any stay changes\n3. Set resolution_action = `policy-applied-no-action`\n4. Set ticket status = `solved`\n\n#### 4.1.3 Modification Fee Schedule\n\n**Base Fees by Time Until Check-in:**\n\n| Time Until Check-in | Base Fee |\n|---------------------|----------|\n| ≥168 hours (≥7 days) | $0 (FREE) |\n| ≥48 hours AND <168 hours (2-7 days) | $25 |\n| ≥24 hours AND <48 hours (24-48 hours) | $50 |\n| <24 hours (same day) | $60 (requires hotel approval; see 4.1.5) |\n\n**Hotel Partner Tier Multipliers:**\n\n| partner_tier | Multiplier |\n|--------------|------------|\n| `premium` | 0.5× |\n| `standard` | 1.0× |\n| `budget` | 1.5× |\n\n**Multiple Modification Surcharges:**\n\nCount previous entries in booking.modification_history array:\n\n| Modification Count | Surcharge |\n|--------------------|-----------|\n| First modification (0 previous) | $0 |\n| Second modification (1 previous) | +$15 |\n| Third or more (≥2 previous) | +$30 |\n\n**Fee Calculation Formula:**\n\n```\nmodification_fee = (base_fee × hotel_tier_multiplier) + modification_surcharge\n```\n\n**Example:** Customer modifies booking at standard hotel, 3 days before check-in, second modification:\n- Base fee = $25 (2-7 days)\n- Multiplier = 1.0× (standard)\n- Surcharge = $15 (second modification)\n- Total = ($25 × 1.0) + $15 = $40\n\n**Rounding Rule:** Round to nearest cent. If exactly $X.XX5, round up.\n\n#### 4.1.4 Modification Fee Exceptions\n\n**Platinum Customer Exception:**\n- IF vip_tier = `platinum` AND time until check-in ≥24 hours\n- THEN modification_fee = $0 (all fees waived)\n\n**Enterprise Corporate Exception:**\n- IF corporate_account_tier = `enterprise`\n- THEN modification_fee = $0 (all fees waived, no approval needed)\n\n**Mid-Market Corporate Exception:**\n- IF corporate_account_tier = `mid_market` AND the ORIGINAL booking_value (before modification) is <$1,000\n- THEN standard fees apply\n- IF corporate_account_tier = `mid_market` AND the ORIGINAL booking_value (before modification) is ≥$1,000\n- THEN DO NOT execute the booking modification until manager approval is received. Place ticket on hold, note "Pending manager approval for corporate booking modification", fees waived if approved\n\n**Small Business Corporate:**\n- Same as B2C standard fees\n\n#### 4.1.5 Same-Day Modification Process\n\nWhen time until check-in <24 hours:\n\n**For budget partner hotels:**\n- Same-day modifications are NOT available, regardless of customer VIP tier or corporate account tier (including Enterprise)\n- This is a hotel capability restriction, not a fee issue\n- Inform customer: "Same-day modifications are not supported by this hotel property."\n- Offer cancellation and rebooking as alternative (note: cancellation fees per Section 4.2 still apply)\n- Set resolution_action = `policy-applied-no-action`\n\n**For standard/premium partner hotels:**\n1. For customers with vip_tier = `standard`, escalate to the hotel partner for confirmation. For customers with vip_tier = `vip` or `platinum`, hotel escalation is not required if you can verify same-day availability using booking or partner systems.\n2. If you escalate to the hotel partner, set escalation_reason = `same-day-modification`\n3. Set ticket status = `hold`\n4. Add tag `hotel-partner-escalation`\n5. Upon hotel confirmation → Process modification, set resolution_action = `modification-completed`\n6. Upon hotel decline → Inform customer, offer alternatives, set resolution_action = `policy-applied-no-action`\n\n**Note on Enterprise tier:** Enterprise tier waives modification fees but does NOT exempt from hotel partner confirmation requirements for same-day changes. The escalation rules above apply regardless of corporate account tier.\n\n#### 4.1.6 Processing Modifications\n\nCalculate modification fee per Section 4.1.3, including any multiple modification surcharges based on modification history count. \n\nCheck for approval requirements per Section 4.1.4. For mid-market corporate bookings where original booking_value ≥$1,000: STOP and place ticket on hold without executing the modification.\n\nAfter confirming eligibility and calculating fees:\n\n1. Execute booking modification with new details\n2. If new booking_value > original: Process charge for the additional amount using the payment system and inform customer of the amount charged\n3. If new booking_value < original: Process partial refund for difference\n4. If modification_fee > $0: Process the modification fee charge using with the payment system and inform customer of the fee amount\n5. If both price difference and modification fee apply, process the total charge (price_difference + modification_fee) using the payment system before closing the ticket.\n6. Update the ticket:\n   - Set request_type_detail to appropriate modification type\n   - Set resolution_action = `modification-completed`\n   - Set booking_reference, hotel_id, check_in_date, booking_value\n\n---'
      - name: cancellations_refunds.md
        snippets:
          - '### 4.2 Cancellations & Refunds\n\n#### 4.2.1 Cancellation Eligibility\n\n**HOTEL PARTNER TIER CANCELLATION POLICIES**:\n- **Premium Partner Hotels:** 24-hour cancellation window\n- **Standard Partner Hotels:** 48-hour cancellation window\n- **Budget Partner Hotels:** 7-day cancellation window\n\n**CORPORATE ACCOUNT TIER POLICIES** (if corporate_account_id present):\n- **Enterprise Tier:** 100% refund if cancelled >48h before check-in (overrides hotel policy)\n- **Mid-Market Tier:** Follow hotel tier policy (no override)\n- **Small Business Tier:** Follow hotel tier policy (no override)\n\nRefund amount with specific thresholds:\n\n  **For 7-Day Policy Hotels:**\n  - ≥168 hours (≥7 days) before check-in: 100% refund, service fee ($15) retained\n  - ≥48 hours AND <168 hours (2-7 days) before check-in: 75% refund, service fee ($15) retained\n  - ≥24 hours AND <48 hours (24-48h) before check-in: 50% refund, service fee ($15) retained\n  - <24 hours before check-in: 0% refund (no refund)\n\n  **For 48-Hour Policy Hotels:**\n  - ≥48 hours before check-in: 100% refund, service fee ($15) retained\n  - ≥24 hours AND <48 hours (24-48h) before check-in: 50% refund, service fee ($15) retained\n  - <24 hours before check-in: 0% refund (no refund)\n\n  **For 24-Hour Policy Hotels:**\n  - ≥24 hours before check-in: 100% refund, service fee ($15) retained\n  - <24 hours before check-in: 0% refund (no refund)\n\n  **Service Fee Applicability:** The $15 service fee is ONLY applicable when processing cancellation refunds. If a service_fee charge appears on a non-cancelled booking (e.g., a booking that remains `confirmed` or was modified but not cancelled), this constitutes a billing error—process refund of $15 and set escalation_reason = `system-error`.\n\n  **VIP Platinum Exceptions:**\n  - Platinum tier + ≥24 hours before check-in: 100% refund INCLUDING service fee (regardless of standard policy)\n  - Platinum tier + <24 hours: Standard policy applies (no special exception)\n\n  **Corporate Account Overrides:**\n  - Enterprise tier: 100% refund if ≥48 hours before check-in (overrides hotel policy)\n  - Mid-market tier: Follow hotel policy\n  - Small business tier: Follow hotel policy\n\nAll bookings with booking_status = `confirmed` may be cancelled.\n\n**Refund eligibility depends on:**\n- Hotel partner_tier (determines cancellation window)\n- Time until check-in\n- Customer vip_tier (platinum exceptions)\n- Corporate account_tier (if applicable)\n\n#### 4.2.2 Refund Calculation by Hotel Partner Tier\n\n**For budget tier hotels (7-day cancellation policy):**\n\n| Time Until Check-in | Refund % | Service Fee |\n|---------------------|----------|-------------|\n| ≥168 hours (≥7 days) | 100% | $15 retained |\n| ≥48 hours AND <168 hours (2-7 days) | 75% | $15 retained |\n| ≥24 hours AND <48 hours (24-48 hours) | 50% | $15 retained |\n| <24 hours | 0% | No refund |\n\n**For standard tier hotels (48-hour cancellation policy):**\n\n| Time Until Check-in | Refund % | Service Fee |\n|---------------------|----------|-------------|\n| ≥48 hours | 100% | $15 retained |\n| ≥24 hours AND <48 hours | 50% | $15 retained |\n| <24 hours | 0% | No refund |\n\n**For premium tier hotels (24-hour cancellation policy):**\n\n| Time Until Check-in | Refund % | Service Fee |\n|---------------------|----------|-------------|\n| ≥24 hours | 100% | $15 retained |\n| <24 hours | 0% | No refund |\n\n**Refund Amount Formula:**\n\n```\nrefund_amount = (booking_value × refund_percentage) - service_fee\n```\n\nWhere service_fee = $15 when refund_percentage > 0%, otherwise $0.\n\n**Example:** $400 booking at standard hotel, cancelled 36 hours before check-in:\n- Refund % = 50% (≥24h AND <48h)\n- Service fee = $15\n- Refund = ($400 × 0.50) - $15 = $185\n\n#### 4.2.3 Cancellation Refund Exceptions\n\n**Platinum Customer Exception:**\n- IF vip_tier = `platinum` AND time until check-in ≥24 hours\n- THEN refund = 100% of booking_value (service fee waived)\n- Set resolution_action = `refund-full`\n\n**Platinum Exception Does NOT Apply:**\n- IF vip_tier = `platinum` AND time until check-in <24 hours\n- THEN standard policy applies (no special exception)\n\n**Enterprise Corporate Exception:**\n- IF corporate_account_tier = `enterprise` AND time until check-in ≥48 hours\n- THEN refund = 100% of booking_value with service fee RETAINED\n- refund_amount = booking_value - $15\n- Set resolution_action = `refund-full`\n\n> **Note:** Enterprise tier overrides hotel partner cancellation windows but retains the standard $15 service fee. This differs from Platinum tier (service fee waived) and System Error (service fee waived).\n\n**System Error Exception:**\n- IF a booking error or charge discrepancy was caused by a confirmed system malfunction (for example, a documented pricing error, a duplicate charge generated by the payment processor, or a known integration defect that you can verify using internal logs or incident information)\n- THEN refund = 100% of booking_value (service fee waived)\n- Document the specific system error details and how it was confirmed in the ticket description\n- Set escalation_reason = `system-error`\n\n**Partial Refunds for Price Corrections (Non-Cancellation):**\n- When processing a partial refund to correct a price discrepancy on a booking that is NOT being cancelled (booking remains `confirmed`), set resolution_action = `refund-partial`\n- This applies to billing overcharges (Section 4.3.5), price corrections, and similar adjustments where the customer keeps the booking\n- Do NOT use `refund-full` unless the entire booking is being cancelled and fully refunded\n\n#### 4.2.4 Processing Cancellations\n\n**Important:** Cancellation refund eligibility and amounts are determined SOLELY by the policy rules in Sections 4.2.1-4.2.3 (hotel tier, timing, customer tier, corporate tier). Do NOT examine payment transaction history to determine refund eligibility. Transaction history is only relevant for verifying payment was received, not for calculating refund amounts.\n\n1. Verify booking_status = `confirmed`\n2. Retrieve hotel partner_tier\n3. Calculate time until check-in from current date/time\n4. Check customer vip_tier\n5. Check corporate account_tier (if corporate_account_id exists)\n6. Calculate refund_amount per above rules\n7. Update booking_status to `cancelled`\n8. If refund_amount > $0: Process refund with reason = "cancellation"\n9. Update ticket:\n    - Set request_type_detail = `cancel-booking`\n    - Set resolution_action = `refund-full`, `refund-partial`, or `policy-applied-no-action`\n    - Set refund_amount field (use 0 if no refund)\n    - Set booking_reference, hotel_id, check_in_date, booking_value\n\n**If refund processing fails (step 8):**\n- Do NOT reverse the cancellation (booking remains cancelled)\n- Set escalation_reason = `system-error`\n- Set ticket status = `hold`\n- Document the failure details in ticket description: "Cancellation completed. Refund processing failed: [error details]. Amount owed: $[refund_amount]."\n- Inform customer: "Your booking has been cancelled. We encountered a technical issue processing your refund of $[amount]. Our team is working on this and the refund will be processed within 24-48 hours. Reference: [ticket_id]."\n\n---'
      - name: corporate_account_services.md
        snippets:
          - '### 4.6 Corporate Account Services\n\n#### 4.6.1 Corporate Booking Modifications\n\nApply corporate tier policies from Section 3.2.3:\n\n**Enterprise tier:**\n- All modifications free\n- No approval required\n- Same-day modifications allowed with hotel confirmation\n- Cancellation window: 48h (100% refund if >48h before check-in)\n- Hotel change: Allowed without fees\n\n**Mid-market tier:**\n- booking_value <$1,000: Standard B2C fees apply\n- booking_value ≥$1,000: Place on hold for manager approval, fees waived if approved\n\n**Small business tier:**\n- Same as B2C standard fees and policies\n\n#### 4.6.2 Corporate Invoice Generation\n\n1. Verify booking has corporate_account_id\n2. Verify corporate account account_status = `active`\n   - **If account_status is NOT active** (e.g., `expired`, `suspended`, `pending`):\n     a. Inform the customer that corporate invoices require an active corporate account\n     b. Offer to generate a standard receipt (invoice_type = `receipt`) as an alternative for expense records\n     c. If customer accepts the receipt, generate and provide it, then set resolution_action = `information-provided`\n     d. If customer declines, set resolution_action = `policy-applied-no-action`\n3. Generate corporate invoice with company details and payment terms\n4. Provide invoice URL and invoice_id to customer\n5. Set resolution_action = `information-provided`\n\n#### 4.6.3 Corporate Policy Inquiries\n\n1. Retrieve corporate account details\n2. Provide information based on account_tier\n3. Reference knowledge base article on corporate benefits for detailed explanations\n4. Set resolution_action = `information-provided`\n\n---'
      - name: customer_user_segmentation.md
        snippets:
          - '## 3. Customer & User Segmentation\n\n### 3.1 User Type Classification\n\nIdentify and classify every customer into exactly one user type:\n\n| User Type | Identification Rule | DB user_type Value |\n|-----------|--------------------|--------------------|\n| Individual Traveler (B2C) | No corporate_account_id AND no group_booking_id on booking | `b2c_customer` |\n| Corporate Account Holder | booking has corporate_account_id OR customer email domain matches corporate account | `corporate_account_holder` |\n| Group Coordinator | booking has group_booking_id OR customer is listed as coordinator_email in group_bookings | `group_coordinator` |\n| Hotel Partner | Customer organization_type = `hotel_partner` OR contacting about hotel operations | `hotel_partner` |\n\n### 3.2 Customer Tier Segmentation\n\n#### 3.2.1 VIP Tier (from CRM customer_profiles.vip_tier)\n\n| Tier Value | Identification | Policy Impact |\n|------------|----------------|---------------|\n| `standard` | Default tier, no special status | Standard policies apply |\n| `vip` | High-value customer designation | Priority fulfillment for room preferences |\n| `platinum` | Highest tier designation | Fee waivers, extended complaint windows, service fee waivers (see specific policies) |\n\n**VIP Tier Benefits Summary:**\n\n| Benefit | standard | vip | platinum |\n|---------|----------|-----|----------|\n| Modification fee waiver (>24h before check-in) | No | No | Yes |\n| Cancellation service fee waiver (>24h before check-in) | No | No | Yes |\n| Post-stay complaint window | 7 days | 7 days | 14 days |\n| Room preference priority | No | Yes | Yes |\n| Early check-in fee waiver | No | No | Yes |\n| Late checkout fee waiver | No | No | Yes |\n\n#### 3.2.2 Hotel Partner Tier\n\n| Tier Value | Cancellation Window | Modification Fee Multiplier | Same-Day Modifications |\n|------------|--------------------|-----------------------------|------------------------|\n| `premium` | 24 hours | 0.5× (50% discount) | Allowed with hotel confirmation |\n| `standard` | 48 hours | 1.0× (no adjustment) | Requires hotel confirmation |\n| `budget` | 7 days | 1.5× (50% surcharge) | NOT allowed (must cancel and rebook) |\n\n#### 3.2.3 Corporate Account Tiers\n\n| Tier Value | Payment Terms | Modification Policy | Cancellation Policy | Max Rooms |\n|------------|---------------|---------------------|---------------------|-----------|\n| `enterprise` | Net 60 | All free, no approval | 100% refund if ≥48h before check-in (overrides hotel policy), $15 service fee retained | 50 |\n| `mid_market` | Net 45 | Standard B2C fees if projected value <$1,000; approval required + fees waived if ≥$1,000 | Follows hotel tier policy (no override) | 15 |\n| `small_business` | Net 30 | Same as B2C standard | Follows hotel tier policy (no override) | 5 |\n\nBilling policies based on account tier:\n  - **small_business:**\n    - Payment terms: Net-30\n    - Invoicing: Per booking\n    - Credit limit: $10,000\n    - Late payment fee: 2% per month\n  - **mid_market:**\n    - Payment terms: Net-45\n    - Invoicing: Monthly consolidated\n    - Credit limit: $50,000\n    - Late payment fee: 1.5% per month\n  - **Enterprise:**\n    - Payment terms: Net-60\n    - Invoicing: Monthly consolidated with detailed reporting\n    - Credit limit: $200,000\n    - Late payment fee: 1% per month\n\n\n**CORPORATE ACCOUNT TIER POLICIES** (if corporate_account_id present):\n- **Enterprise Tier:**\n  - All modifications: FREE (no fees)\n  - Approval: Not required\n  - Same-day: Allowed with hotel confirmation\n- **Mid-Market Tier:**\n  - If the projected total booking_value after the proposed modification is <$1,000: Standard B2C fees apply\n  - If the projected total booking_value after the proposed modification is ≥$1,000: Place the ticket on hold for manager approval (policy rule); modification fees are waived if approved\n  - Same-day: Allowed with hotel confirmation\n- **Small Business Tier:**\n  - Same as B2C standard fees\n  - No special privileges\n\n### 3.3 Segment Policy Application Order\n\n**BASE MODIFICATION FEE SCHEDULE** (B2C and Small Business Corporate):\n- ≥168 hours (≥7 days) before check-in: $0 (FREE)\n- ≥48 hours AND <168 hours (2-7 days) before check-in: $25 fixed fee\n- ≥24 hours AND <48 hours (24-48h) before check-in: $50 fixed fee\n- <24 hours before check-in: $60 fixed fee (requires hotel approval; see Section 4.1.5)\n\n**ADDITIONAL RULES:**\n- **VIP Platinum Exceptions:** Waive all fees for modifications >24h before check-in (any hotel tier)\n- **High-value threshold:** Bookings >$2000 require additional verification\n- **Multiple modifications:** Second modification +$15 surcharge, third+ +$30 surcharge\n\nWhen multiple tier policies apply, evaluate in this order:\n\n1. **Check for VIP platinum exceptions first** — If customer is platinum AND meets exception criteria, apply platinum benefit\n2. **Check corporate account tier** — If booking has corporate_account_id, check if corporate policy is more favorable\n3. **Apply hotel partner tier policy** — Use hotel''s partner_tier for base cancellation windows and fee multipliers\n4. **Apply base B2C policy** — Default policy if no tier exceptions apply\n\n**Rule:** Apply the policy most favorable to the customer when corporate and hotel tier policies conflict.\n\n**Corporate Account Status Requirement:** Corporate account benefits (including fee waivers, extended cancellation windows, and approval processes) only apply when the corporate account `account_status` = `active`. For bookings associated with expired, suspended, or pending corporate accounts, apply standard B2C policies instead.'
      - name: escalation_procedures.md
        snippets:
          - '### 4.9 Escalation Procedures\n\n#### 4.9.1 Mandatory Hotel Partner Escalation\n\nEscalate in these situations without exception:\n\n- Same-day modifications (time until check-in <24 hours) at standard/premium hotels **for customers with vip_tier = `standard`** (customers with vip_tier = `vip` or `platinum` are not required to be escalated for same-day modifications; see Section 4.1.5 for processing guidance)\n- Large group modifications (≥16 rooms) at any timing\n- Medium group modifications (6-15 rooms) when time until check-in <48 hours\n- Post-stay complaints requiring hotel verification\n- Guest issues reported by hotel partner\n- Booking data discrepancies between systems\n\n**Exception for verifiable discrepancies:** When a hotel partner reports a data discrepancy and StayBridge data is verified as correct (e.g., modification_history confirms the current values, no system error evidence exists), escalation is not required. Provide the correct information to the hotel per Section 4.8.2 and resolve immediately with resolution_action = `information-provided`.\n\n#### 4.9.2 Conditional Hotel Partner Escalation\n\nEscalate when these conditions are met:\n\n- Billing dispute involves booking_value >$500\n- Customer has complaint_count ≥3\n- Special request requires hotel capabilities verification\n- Complex requests beyond standard policy parameters\n\n**Clarification:** Do not escalate when hotel capabilities can be verified through available system tools (e.g., hotel_partner_api_get_hotel_info for supports_pets or accessible_rooms_available). For special accommodation requests that can be verified via system tools, follow Section 4.5.2 processing steps directly without hotel escalation.\n\n#### 4.9.3 Escalation Process\n\n1. Gather all relevant booking and customer information\n2. Document the issue clearly in ticket description\n3. Create escalation to hotel partner\n4. Record escalation tracking information\n5. Set ticket status = `hold`\n6. Add tag `hotel-partner-escalation`\n7. Set appropriate escalation_reason value\n\n\n**Important:** The ''escalate to hotel'' tool automatically creates an internal tracking ticket. Do NOT create a separate Zendesk ticket when using this tool—use the existing customer ticket and update its status to `hold` per step 5.'
      - name: group_booking_services.md
        snippets:
          - '### 4.7 Group Booking Services\n\n**Applicability:** Group modification rules and fees apply whenever ANY booking with a `group_booking_id` is modified, regardless of whether using group booking tools or individual booking tools. When processing modifications for bookings that are part of a group, always apply Section 4.7 rules.\n\n#### 4.7.1 Group Size Classifications\n\n| Classification | Room Count | Identifier |\n|----------------|------------|------------|\n| Small Group | ≥2 AND ≤5 rooms | small |\n| Medium Group | ≥6 AND ≤15 rooms | medium |\n| Large Group | ≥16 rooms | large |\n\n#### 4.7.2 Group Modification Rules\n\n**Small Groups (2-5 rooms):**\n\n| Time Until Check-in | Base Per-Room Fee | Escalation Required |\n|---------------------|-------------------|---------------------|\n| ≥168 hours (≥7 days) | $0 | No |\n| ≥48 hours AND <168 hours | $25 | No |\n| ≥24 hours AND <48 hours | $50 | Yes (hotel confirmation) |\n| <24 hours | $60 | Yes (hotel approval required) |\n\n> **Note:** Apply hotel_tier_multiplier in the total fee calculation (Section 4.7.3), not to individual base fees.\n\n**Medium Groups (6-15 rooms):**\n\n| Time Until Check-in | Base Per-Room Fee | Escalation Required |\n|---------------------|-------------------|---------------------|\n| ≥168 hours (≥7 days) | $0 | No |\n| ≥48 hours AND <168 hours | $25 | Hotel notification |\n| ≥24 hours AND <48 hours | $50 | MANDATORY hotel approval |\n| <24 hours | $60 | MANDATORY hotel approval |\n\n> **Note:** Apply hotel_tier_multiplier in the total fee calculation (Section 4.7.3), not to individual base fees.\n\n**Note:** For budget tier hotels, medium group changes within 7 days require escalation.\n\n**Room Selection for Partial Modifications:** When a group coordinator cannot specify which rooms to modify, select rooms in ascending booking reference order (e.g., BKG-00001001, BKG-00001002, etc.). Document the selection method in the ticket description.\n\n**Large Groups (≥16 rooms):**\n- ALL modifications at ANY timing require hotel partner approval\n- These are contract modifications, not standard booking changes\n- Set escalation_reason = `large-group-booking`\n\n\n**HOTEL PARTNER TIER ADJUSTMENTS:**\n- **Premium Partner Hotels:**\n  - Large groups: Allow modifications >7 days without escalation; this premium exception supersedes the general rule that all large group (≥16 rooms) modifications require hotel partner approval when the request is made more than 7 days before check-in\n  - Fees: 0.5x multiplier (50% discount on per-room fees)\n- **Standard Partner Hotels:**\n  - Standard escalation rules apply\n  - Fees: 1x multiplier (standard per-room fees)\n- **Budget Partner Hotels:**\n  - Stricter escalation: Medium groups require escalation if <7 days\n  - Fees: 1.5x multiplier (50% surcharge on per-room fees)\n\n#### 4.7.3 Group Fee Calculation\n\n```\ntotal_fee = base_per_room_fee × number_of_rooms_modified × hotel_tier_multiplier\n```\n\nWhere `base_per_room_fee` is the USD amount from Section 4.7.2 tables (before any multiplier).\n\n**Example:** Medium group (10 rooms) at premium hotel, modifying 5 rooms, 5 days before check-in:\n- Base per-room fee = $25 (from table: ≥48h AND <168h)\n- Hotel multiplier = 0.5× (premium)\n- Rooms modified = 5\n- Total = $25 × 5 × 0.5 = $62.50\n\n**Large groups (≥16 rooms):** Use the same per_room_fee values by time window as defined for medium groups in Section 4.7.2, then apply the hotel_tier_multiplier and the number_of_rooms_modified. For premium partner hotels, the >7-day large-group exception (no escalation) means per_room_fee is $0 for large-group modifications requested ≥7 days before check-in.\n\n**Processing Group Modification Charges:** For group modifications, process BOTH applicable charges:\n1. **Group modification fee:** If total_fee > $0 per the formula above, process as a charge with reason = "group_modification_fee"\n2. **Price difference:** If total booking_value increases, process the additional amount as a charge with reason = "price_difference". If total booking_value decreases, process a partial refund.\n\nProcess these as a combined total charge (modification_fee + price_difference) using the first booking reference in the group as the booking_reference parameter.\n\n**booking_value for Partial Group Modifications:** Set booking_value to the total value of rooms being modified: number_of_rooms_modified × per_room_value.\n\n**Group Booking Cancellations:** Group booking cancellations follow Section 4.2 (Cancellations & Refunds) policies. Each room in the group is treated as an individual booking for refund calculation purposes—apply the hotel tier cancellation policy, timing rules, and customer/corporate tier exceptions per room. The $15 service fee applies once per cancelled room, not once per group. When cancelling individual bookings from a group, treat as individual booking cancellations per Section 4.2—group modification escalation requirements do NOT apply to cancellations.\n\n**booking_value for Partial Group Cancellations:** Set booking_value to the total value of the REMAINING rooms after cancellation (not the cancelled rooms).\n\n**Group Payment Transactions:** For group-level refunds or charges, use the first booking reference in the group''s booking_references array as the booking_reference parameter.\n\n#### 4.7.4 Group Coordination Requests\n\nFor special group requests (meeting rooms, catering, transportation):\n\n1. Retrieve group booking details\n2. Check hotel capabilities based on partner_tier\n3. For complex requests: Escalate to hotel partner\n4. Add approved requests to booking\n5. Set request_type_detail = `add-special-request`\n\n#### 4.7.5 Group Billing Options\n\n- **Split billing:** Individual room charges to separate payment methods\n- **Master account:** All charges to group coordinator\n- **Mixed billing:** Room charges to master, incidentals to individuals\n\n**Processing Billing Arrangement Requests:** For requests to set up or change group billing arrangements:\n1. Set request_type_detail = `add-special-request`\n2. Escalate to hotel partner for configuration with escalation_reason = `hotel-confirmation-required`\n3. Set ticket status = `hold`\n\n---'
      - name: hotel_partner_requests.md
        snippets:
          - '### 4.8 Hotel Partner Requests\n\n#### 4.8.1 Booking Verification Requests\n\nWhen hotel partners request booking verification:\n\n1. Verify hotel partner identity (user organization_type = `hotel_partner`)\n2. Retrieve booking by booking_reference\n3. **If booking exists:** Provide guest name, check-in/out dates, room_type, adults_count, children_count, special_requests. Set resolution_action = `information-provided`.\n4. **If booking does NOT exist:**\n   a. Check payment/transaction history for the booking reference\n   b. If payment exists without booking: Escalate as system error, set escalation_reason = `system-error`\n   c. If no payment exists: Inform the hotel partner that no booking was created in the StayBridge system. Set resolution_action = `information-provided`.\n5. Set request_type_detail = `other`\n6. Set status = `solved`\n\n#### 4.8.2 Booking Discrepancy Resolution\n\n**Ticket Type:** For hotel partner verification requests where only information is provided, use type = `question`. For discrepancy reports requiring data corrections, use type = `task`.\n\n**Request Type:** For all hotel partner discrepancy inquiries, set request_type_detail = `other` (discrepancy inquiries are not modification requests).\n\nWhen hotel reports data mismatch:\n\n1. Retrieve booking from StayBridge system\n2. Compare with hotel''s reported data\n3. Identify discrepancy type (dates, guest count, room type, pricing)\n4. **If StayBridge data is incorrect:** Correct the booking. Set resolution_action = `modification-completed`.\n5. **If hotel data is incorrect:** Provide correct information to the hotel. Set resolution_action = `information-provided`.\n6. **For complex discrepancies or potential technical issues:** Use available system logs, integration monitoring, and any known incident information to determine whether a system error has occurred (for example, dates, guest counts, or room types that are consistently mismatched across systems). If a system error is confirmed, document the technical details and your findings in the ticket description and set escalation_reason = `system-error`. For errors requiring booking correction without refund (e.g., hotel needs to reassign room), correct the data and set resolution_action = `information-provided` or `modification-completed` as appropriate—do NOT process a refund unless the guest was overcharged.\n\n**Data Authority:** When no modification_history exists and no system error can be confirmed, StayBridge booking data is authoritative. Do NOT modify the booking based on unverified guest claims. Inform the hotel partner that no modification was recorded in the StayBridge system.\n\n**Occupancy Discrepancies (Partial No-Show):** When hotel reports fewer guests arrived than were booked, and StayBridge booking data is correct (no system error): Confirm records are accurate, explain that actual arrival discrepancies do not affect booked rates, and advise that charge adjustments for partial no-show are a matter between the hotel and guest. Set resolution_action = `information-provided`.\n\n**Ticket Status:** When the hotel partner acknowledges and agrees to take corrective action on their side (e.g., reassign room, update their records), the ticket can be marked `solved`. The ticket does not need to remain on `hold` waiting for hotel confirmation of completion.\n\n#### 4.8.3 Commission & Rate Inquiries\n\nWhen hotel partners ask about commissions or rates:\n\n1. Retrieve hotel partner information\n2. Provide commission structure based on partner_tier (do not disclose specific rates to customers)\n3. For rate update requests: Document and inform the hotel this routes to the partnerships team.\n4. For technical integration issues (e.g., connectivity or mapping problems): Document the issue and follow the internal technical-issue process; no separate external escalation to a technical team is required.\n\n---'
      - name: post_stay_issues.md
        snippets:
          - '### 4.4 Post-Stay Issues\n\n#### 4.4.1 Complaint Categories\n\n| Category | Examples | Identifier |\n|----------|----------|------------|\n| Service Complaints | Poor staff service, amenities unavailable, noise issues | service |\n| Room Condition Issues | Cleanliness problems, broken fixtures, room not as described | room_condition |\n| Billing Discrepancies | Incorrect hotel charges, unauthorized minibar charges | billing |\n\n#### 4.4.2 Complaint Timing Windows\n\nCalculate days since checkout = (current_date_time - check_out_date) in days\n\n**Standard Customers (vip_tier = `standard` or `vip`):**\n\n| Days Since Checkout | Eligible Complaints | Action |\n|--------------------|---------------------|--------|\n| ≤2 days (≤48 hours) | All types | Process per Section 4.4.3 |\n| >2 days AND ≤7 days | All types with evidence | Process per Section 4.4.3 with reduced compensation |\n| >7 days | Billing disputes only | Place on hold for manager approval |\n\n**Platinum Customers (vip_tier = `platinum`):**\n\n| Days Since Checkout | Eligible Complaints | Action |\n|--------------------|---------------------|--------|\n| ≤7 days | All types | Process per Section 4.4.3 |\n| >7 days AND ≤14 days | All types with evidence | Process per Section 4.4.3 |\n| >14 days | Billing disputes only | Place on hold for manager approval |\n\n**Evidence Requirement:** For room condition complaints reported >48 hours after checkout, request photo evidence from customer.\n\n#### 4.4.3 Compensation Guidelines\n\n**Service Complaints:**\n\n| Timing | vip_tier | Compensation |\n|--------|----------|--------------|\n| ≤48 hours | standard/vip | 50% of affected night(s) value |\n| ≤48 hours | platinum | 100% of affected night(s) value |\n| >48 hours AND ≤7 days | standard/vip | 25% of affected night(s) value |\n| >48 hours AND ≤14 days | platinum | 50% of affected night(s) value |\n\n**Room Condition Issues:**\n\n| Timing | Severity | vip_tier | Compensation |\n|--------|----------|----------|--------------|\n| ≤48 hours | Minor (cosmetic issues) | standard/vip | 25% of booking_value |\n| ≤48 hours | Minor | platinum | 50% of booking_value |\n| ≤48 hours | Major (uninhabitable, safety concerns) | standard/vip | 75% of booking_value |\n| ≤48 hours | Major | platinum | 100% of booking_value |\n| >48 hours AND ≤7 days | Any with evidence | standard/vip | 25% of booking_value |\n| >48 hours AND ≤14 days | Any with evidence | platinum | 50% of booking_value |\n\n**Severity Definitions:**\n- **Minor:** Cosmetic issues, minor inconveniences (e.g., stained carpet, slow drain, missing amenity)\n- **Major:** Uninhabitable conditions, safety concerns, fundamental issues (e.g., no hot water, broken AC in summer, pest infestation, significant cleanliness failures)\n\n**Affected nights:** Unless otherwise specified in this Policy or in the ticket, assume that all nights in the stay were affected when calculating the "affected night(s) value" used in the tables above.\n\n**Affected Nights Value Calculation:**\n```\ntotal_nights = check_out_date - check_in_date (number of nights)\nnightly_value = booking_value ÷ total_nights\naffected_nights_value = nightly_value × affected_nights_count\ncompensation_amount = affected_nights_value × compensation_percentage\n```\n\nWhere `affected_nights_count` = total_nights unless documented otherwise in the ticket.\n\n**Rounding:** Round to nearest cent. If exactly $X.XX5, round up.\n\n**Example:** $600 booking for 3 nights, service complaint reported ≤48h, standard customer:\n- nightly_value = $600 ÷ 3 = $200\n- affected_nights_value = $200 × 3 = $600 (all nights affected)\n- compensation = $600 × 50% = $300\n\n**Billing Errors:** See Section 4.3.5 (Billing Overcharge Corrections) for processing billing overcharges. For post-stay billing disputes requiring hotel verification, escalate per Section 4.4.4.\n\n#### 4.4.4 Hotel Partner Escalation for Post-Stay Issues\n\n**Escalate to hotel partner when:**\n- Complaint involves disputed facts requiring hotel verification (i.e., customer''s account conflicts with documented records, NOT simply any service complaint)\n- Customer complaint_count ≥3 (multiple complaints on record)\n- booking_value >$500 AND complaint severity cannot be determined from Section 4.4.3 guidelines\n- Complaint severity cannot be determined from customer description to fit Minor or Major categories defined in Section 4.4.3\n\nSet escalation_reason = `guest-complaint`\nSet ticket status = `hold`\nAdd tag `hotel-partner-escalation`\n\n**Direct compensation WITHOUT escalation is appropriate when ALL of the following are true:**\n1. Complaint is within the eligible timing window per Section 4.4.2\n2. Customer complaint_count < 3\n3. booking_value ≤ $500, OR severity is clearly determinable from Section 4.4.3 (regardless of booking_value)\n4. Service failure is clearly stated by the customer and does not conflict with any known records\n5. Complaint category (service, room condition) clearly matches Section 4.4.3 tables\n\n**Evidence handling:** For room condition complaints where customer provides photographic evidence and issues clearly match defined severity categories (Minor/Major), process compensation directly per Section 4.4.3 without hotel escalation. Escalate only when evidence is absent/unclear, customer''s description conflicts with booking records, or other mandatory triggers are met.\n\n**The escalation criteria above are exhaustive.** When compensation is calculable per Section 4.4.3, escalation is NOT required even if booking_value > $500.\n\n#### 4.4.5 Processing Post-Stay Compensation\n\n1. Verify booking exists and booking_status = `checked_out`\n2. Calculate days since checkout\n3. Determine complaint category\n4. Check customer vip_tier\n5. Check customer complaint_count\n6. If escalation needed: Escalate and await hotel response\n7. Calculate compensation per Section 4.4.3\n8. Process refund with reason = "post_stay_compensation"\n9. Increment customer complaint_count by 1 whenever a post-stay complaint is processed and compensation is issued (refund or voucher)\n10. Update ticket:\n    - Set request_type_detail = `post-stay-issue`\n    - Set resolution_action = `refund-full`, `refund-partial`, `voucher-issued`, `policy-applied-no-action`, or `information-provided`\n    - Set refund_amount\n\n---'
      - name: pre_stay_support.md
        snippets:
          - '### 4.5 Pre-Stay Support\n\n#### 4.5.1 Booking Confirmation Issues\n\nWhen customer reports missing confirmation or booking not appearing:\n\n1. Search for booking by booking_reference or customer_id\n2. **If booking exists:**\n   - Verify details with customer\n   - Confirm booking is active\n   - Set resolution_action = `information-provided`\n3. **If booking does NOT exist:**\n   - Check transaction history for payment\n   - **If payment exists without booking:** Escalate as system error, set escalation_reason = `system-error`\n   - **If no payment exists:** Inform customer booking was not completed\n\n#### 4.5.2 Special Accommodation Requests\n\n| Request Type | Standard/VIP Customer Fee | Platinum Customer Fee | Notes |\n|--------------|--------------------------|----------------------|-------|\n| Early check-in (before 3 PM), requested ≥24h advance | $25 | $0 | Subject to availability |\n| Early check-in, same-day request | $50 | $50 | Subject to availability |\n| Late checkout until 2 PM | $30 | $0 | Subject to availability |\n| Late checkout after 2 PM | Half-day rate | Half-day rate | Subject to availability |\n| Room preferences (high floor, quiet, view) | $0 | $0 | Best effort, not guaranteed |\n| Connecting room request | $0 | $0 | Best effort, not guaranteed |\n| Accessibility accommodations | $0 | $0 | Always honored if requested ≥24h advance |\n| Pet accommodation | Per hotel policy | Per hotel policy | Check hotel.supports_pets first |\n\n**Fee Definitions:**\n\n- **Half-day rate:** 50% of (booking_value ÷ total_nights), rounded to nearest cent. If exactly $X.XX5, round up.\n  - Example: $400 booking for 2 nights → nightly = $200 → half-day rate = $100\n\n**Processing:**\n1. Verify booking exists.\n2. Check hotel capabilities (including `accessible_rooms_available` and `supports_pets` as appropriate).\n3. For same-day requests at standard/budget hotels: confirm availability with the hotel if needed. For all other requests (≥24h in advance or at premium hotels), proceed without hotel confirmation. **Exception:** For VIP and platinum customers at standard/premium hotels, same-day special requests can be processed without hotel confirmation. "Subject to availability" in the fee table is informational for the customer (the hotel may honor the request based on capacity at the time) but does NOT require agent action to confirm with hotel for non-same-day requests.\n4. Add the customer-accepted special request to `booking.special_requests` with any relevant details (including "subject to availability" notation when applicable).\n5. If a special accommodation fee applies based on the table above, inform the customer of the amount and obtain their acceptance before proceeding.\n6. Special accommodation fees are charged **in addition to** any applicable modification fees when the special request requires a change to booking dates, room type, or board type. If the special request does not require a separate modification (for example, adding or adjusting a preference note only), charge the special accommodation fee (if any) and do not charge a modification fee.\n7. Set request_type_detail = `add-special-request`.\n8. Set resolution_action = `modification-completed`.\n\n**Pet Accommodation:** For pet accommodation requests where hotel.supports_pets = true, add the request to booking.special_requests and inform the customer that hotel-specific pet fees may apply at check-in. Escalation is not required to confirm fee amounts since these are charged directly by the hotel.\n\n**VIP/Platinum Same-Day Early Check-in:** For VIP/platinum same-day early check-in, add to special_requests, charge fee, and resolve without hotel escalation. Actual check-in remains subject to room readiness.\n\n**Group Booking Special Requests:** For GROUP booking special requests at budget hotels within 7 days of check-in, require hotel partner confirmation. Set escalation_reason = `hotel-confirmation-required`.\n\n#### 4.5.3 Policy Clarification Requests\n\nWhen customers ask about policies:\n\n1. Search knowledge base for relevant articles\n2. Provide clear explanation based on policy\n3. For customer-specific calculations (their refund amount, their fee): Retrieve booking and calculate per their specific situation\n4. Set request_type_detail = `other`\n5. Set resolution_action = `information-provided`\n\n---'
      - name: quick_reference_tables.md
        snippets:
          - '## Appendix A: Quick Reference Tables\n\n### A.1 Room Type Capacity\n\n| room_type Value | Max Adults | Max Children |\n|-----------------|------------|--------------|\n| `standard_room` | 2 | 2 |\n| `deluxe_room` | 2 | 2 |\n| `accessible_room` | 2 | 2 |\n| `suite` | 4 | 4 |\n| `executive_suite` | 4 | 4 |\n| `presidential_suite` | 4 | 4 |\n| `family_room` | 4 | 4 |\n\n### A.2 Board Type Options\n\n| board_type Value | Includes |\n|------------------|----------|\n| `without_breakfast` | Room only |\n| `with_breakfast` | Room + breakfast |\n| `half_board` | Room + breakfast + dinner |\n| `full_board` | Room + all meals |\n| `all_inclusive` | Room + all meals + drinks + amenities |\n\n### A.3 Time Calculation Quick Reference\n\nFrom current date/time:\n\n| Description | Hours | Boundary |\n|-------------|-------|----------|\n| Same day | <24 hours AND same calendar day | check-in today |\n| Within 24 hours | <24 hours | urgent/high priority |\n| 24-48 hours | ≥24 AND <48 | $50 base fee |\n| 2-7 days | ≥48 hours AND <168 hours | $25 base fee |\n| 7+ days | ≥168 hours | No fee |\n\n### A.4 Fee Quick Reference\n\n| Scenario | Base Fee | Premium (×0.5) | Standard (×1.0) | Budget (×1.5) |\n|----------|----------|----------------|-----------------|---------------|\n| ≥7 days | $0 | $0 | $0 | $0 |\n| 2-7 days | $25 | $12.50 | $25.00 | $37.50 |\n| 24-48h | $50 | $25.00 | $50.00 | $75.00 |\n| <24h | $60 | $30.00 | $60.00 | $90.00 |'
