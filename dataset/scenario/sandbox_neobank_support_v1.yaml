world_state:
  sandbox_neobank_support_v1:
    sources:
      - name: access_to_tools.md
        snippets:
          - '## 3. **Key Process: Access to Tools**\n\nThis section does not cover \n- Access to production infrastructure during active incidents -> Proceed with section "Security and Incident Response"\n- Access to BI dashboards -> Proceed with section "BI Dashboard Access"\n- Software installation -> Proceed with section "Software installation"\n- Allocating licenses -> Proceed with section "License Management"\n\nTool name format: Tool (level of access)\n\nAccess to a specific tool for a specific employee depends on employee segment, level, and status as well as on tool sensitivity level\n\nNote: if employee used to have access, it was lost (e.g. revoked or expired), and employee requests it again -> Treat it as a completely new request\n\n### 3.1. **Sensitivity Groups**\n\nTools and access levels have different sensitivity level: From the lowest (Group 1) to the highest (Group 5):\n   \n- Public Tools (Sensitivity Group 1, not sensitive): \n    - Slack (member), \n    - Confluence (user),\n    - Zoom (user), \n    - Jira (user), \n    - Workday HRIS (standard), \n    - VPN (standard_employee)\n\n- Internal Tools (Sensitivity Group 2, low sensitivity): \n    - Salesforce CRM (user), \n    - Tableau (viewer),  \n    - GitHub (read_only), \n    - Quantivate (user)\n\n- Confidential Tools (Sensitivity Group 3, medium sensitivity): \n    - Admin Panel (read_only), \n    - Customer PII fields (read_only), \n    - Snowflake depersonalized (analyst), \n    - GitHub (write), \n    - Actimize (user),\n    - Workday HRIS (elevated) \n\n- Customer PII Tools (Sensitivity Group 4, high sensitivity): \n    - Admin Panel (write non-PII only), \n    - Snowflake raw replica (analyst), \n    - Customer PII fields (write)\n\n- Production Infrastructure (Sensitivity Group 5, critical level of sensitivity): \n    - AWS Production (user), \n    - Production database (read_only), \n    - VPN (engineer_prod), \n    - Splunk SIEM (user)\n\nIf a requested tool or requested level of access is not listed -> escalate to IT Operations\n\nIf a request does not clearly define level of requested access (e.g. read_only, viewer, user, write)\n- If there is only one level of access listed above -> use it (e.g. Tableau access requested -> only "Tableau (viewer)" listed -> treat it as request for "Tableau (viewer)" access)\n- If there are a few levels of access listed above -> escalate to IT Operations\n\nBusiness justification (free-form text explaining what access is needed and why) is required for access to Group 4 and Group 5 tools\n\n### 3.2. **Requested vs. Current Access**\n\nBefore provisioning any access, verify the employee''s current access status for the tool:\n    - If employee have access to the tool AND current level of access = requested level of access: Inform employee, treat ticket as informational (`question`)\n    - Else Treat as new access request \n    \n### 3.3. **Employee status and type limitations**\n\nContractors: \n    - Access to Group 4 and Group 5 tools cannot be provided -> Deny\n    - Access to Grop 2 and Group 3 tools must be temporary \n\nOn leave:\n    - Access to Group 2 to Group 5 tools cannot be granted while employees are on leave -> Deny, Notify the employee''s manager of the request.\n\nDeparting: \n    - Access to Group 2 to Group 5 tools cannot be granted -> Deny\n\n### 3.4. **Role based access provision**\n\nA. Group level management\n\n- Public Tools (Sensitivity Group 1)\n    - Default access: all employees\n\n- Production Infrastructure (Sensitivity Group 5) except Splunk SIEM:\n    - May obtain: Compliance & Risk, IT Operations, IT Security\n    - May obtain Temp only (SEV1/2): Product & Engineering \n    - Forbidden: all other\n\nB. Tool level management\n\n- Salesforce CRM (user)\n    - Default access: Sales/BD\n    - May obtain: all other\n\n- Workday HRIS (elevated) - Admin-level access to HR systems\n    - Default access: HR \n    - Forbidden: all other\n\n- Tableau (viewer), GitHub (read_only)\n    - May obtain: all employees\n\n- GitHub (write)\n    - May obtain: Product & Engineering, IT Operations, IT Security\n    - Forbidden: all other\n\n- Admin Panel (read_only)\n    - Default access: Customer Support, Product & Engineering, Compliance & Risk, IT Operations\n    - May obtain: all other\n\n- Admin Panel (write non-PII only)\n    - Default access: Customer Support Tier 2\n    - May obtain: Customer Support Tier 1, Compliance & Risk, IT Operations\n    - Forbidden: all other\n\n- Customer PII fields (read_only)\n    - Default access: Customer Support Tier 2, Compliance & Risk\n    - May obtain: Customer Support Tier 1, IT Operations, Marketing\n    - Forbidden: all other\n\n- Customer PII fields (write)\n    - Forbidden: all employees \n\n- Snowflake depersonalized (analyst)\n    - Default access: Product & Engineering, Compliance & Risk, Finance & Accounting\n    - May obtain: all other\n\n-Snowflake raw replica (analyst)\n    - May obtain: Product & Engineering, Compliance & Risk\n    - Forbidden: all other\n\n- Actimize (user)\n    - Default access: Compliance & Risk\n    - Forbidden: HR, Sales/BD\n    - May obtain: all other\n\n- Quantivate (user)\n    - Default access: Compliance & Risk \n    - May obtain: all other\n\n- Splunk SIEM (user)\n    - Default access: IT Security\n    - May obtain: IT Operations\n    - Forbidden: all other\n\n**Actions**: \n- If "Default": The employee should have this access -> Provide access. No approval needed.\n- If "May obtain": The employee can request this access -> Proceed with Section "Approval Matrix"\n- IF "Forbidden": The employee cannot be granted this access -> Deny \n- IF "Temp only (SEV1/2)": Proceed to section "Security and Incidents Response" \n\n### 3.5. **Approval Matrix**\n\nThis section applies only if Role based access provision = "May obtain"\n\nSet of approvals to be requested is defined by Sensitivity Group and Employee level\n\nSensitivity Group 2: \n    - Individual Contributor (IC) (Level 1–4): Manager approval \n    - Manager (Level 5), Director+ (Level 6–7), Executive (Level 8+): Auto-approved\n\nSensitivity Group 3: \n    - Individual Contributor (IC) (Level 1–4): Manager approval + IT Security approval \n    - Manager (Level 5), Director+ (Level 6–7): IT Security approval \n    - Executive (Level 8+): Auto-approved\n\nSensitivity Group 4, Sensitivity Group 5:\n    - Individual Contributor (IC) (Level 1–4), Manager (Level 5): Director approval + IT Security approval \n    - Director+ (Level 6–7), Executive (Level 8+): IT Security approval\n\n**Actions:** \n- If Auto-approved -> Provide access. No approval needed\n- If not Auto-approved -> Create approval requests\n\nNote: if a few approvals mentioned, all these approvals should be requested (e.g. "Manager approval + IT Security approval" -> create approval request for Manager and approval request for IT Security)\n\n### 3.6. **Temporary vs. Permanent Access**\n\nTemporary Access Applies When:\n    - Production infrastructure access for incident response -> Proceed to section "Security and Incidents Response" \n    - Requester states that request is related to compliance investigation (access duration = duration of investigation)\n    - Requester states that request is project-based (expiry date = project end date)\n    - Employee is Contractor:\n            - If requst states the access end date AND it is sooner than employee contract end date -> expiry date = stated access end date \n            - Else expiry date = employee contract end date\n\nTemporary Access Rules:\n    - Always set `access_expiry_date`\n    - Extensions require new approval\n\nIf an employee requests to extend temporary access before it expires: \n    - Treat as a new access request - do NOT simply extend\n    - Fresh approval(s) should be received \n    - New `access_expiry_date` = current date + requested duration \n    - Even if original access was granted under breaking glass, extension requires standard approval process\n\n**Access Expiry Date Calculation:** **access_expiry_date = current date + access duration**\n\nExample: If current_date = 2025-12-01T13:00:00-05:00 and requested access duration = 24 hours, then access_expiry_date = 2025-12-02T13:00:00-05:00\n\nFor permanent access set access_expiry_date to null'
      - name: bi_dashboard_access.md
        snippets:
          - '## 4. **Key Process (Intent): BI Dashboard Access**\n\n### 4.1. **Dashboard sets**\n\nSome departments have their own set of dashboards. Dashboard access is managed on set level: by adding employee to relevant Dashboard Access Group. For example: if an employee requests access to some Marketing dashboard, they may be added to bi_marketing_viewers Dashboard Access Group -> they get access to all Marketing dashboards (it is impossible to provide access to only one specific table)\n\n| Dashboard Access Group | Department | Dashboard Sensitivity level |\n|------------------------|------------|-----------------------------| \n| `bi_finance_viewers` | Finance & Accounting | `financial_data` |\n| `bi_executive` | Executive & Leadership | `confidential` |\n| `bi_product_analytics` | Product & Engineering | `confidential` |\n| `bi_operations` | IT Operations | `confidential` |\n| `bi_compliance` | Compliance & Risk | `compliance_restricted` |\n| `bi_marketing_viewers` | Marketing  | `confidential` |\n\n### 4.2. **Access management**\n\nDashboard access is managed via Okta: add user to appropriate Dashboard Access Group to grant access \n\nEmployees have default access to BI Dashboard of their own department (no approval needed)\n\nAll employee may request access to other departments dashboards. Approvals are requested based on Dashboard Sensitivity level\n    - `confidential` → Require Manager approval for all employees except Executive & Leadership; Auto-approved for Executive & Leadership\n    - `financial_data` → Require Head of Finance & Accounting approval for all employees except Executive & Leadership; Auto-approved for Executive & Leadership\n    - `compliance_restricted` → Require Head of Compliance approval for all employees\n\nIf employee requests an access to Dashboard Access Group they already belong to -> Inform employee, treat ticket as informational (`question`)'
      - name: employee_infrastructure_troubleshooting.md
        snippets:
          - '## 8. **Key Process (Intent): Employee infrastructure troubleshooting**\n\nApplies to \n- devices provided by the bank to the employee: Laptop, Monitor, Docking Station, Headset, Mouse, Keyboard\n- Office Wi-Fi, Office Printers and Scaners \n- VPN connection \n\nNote: For software troubleshooting proceed with section "Software Troubleshooting"\n\n### 8.1. **Troubleshooting-First Approach**\n\n1. Identify device or connection type and specific symptoms\n\n2. If it is Environmental Issue (VPN or office Wi-Fi issue impacting multiple employees/office-wide, office printer or scaner)\n    - For office Wi-Fi issue impacting multiple employees/office-wide: Treat as `incident` with SEV3 Severity, Escalate to IT Infrastructure team\n    - For VPN issue impacting multiple employees: Treat as `incident` with SEV3 Severity, Escalate to IT Infrastructure team\n    - For office printer or scaner: Treat as `incident` with SEV4 Severity, Escalate to IT Infrastructure team\n\n3. If it is laptop / monitor issue \n    - Search knowledge base for relevant troubleshooting article\n    - If no suitable troubleshooting article exists in the knowledge base for the device type or symptom, provide standard steps (restart device, check cables and ports, update drivers, check settings). Escalation to IT Operations is not required in this case.\n    - Provide recommended troubleshooting steps to employee\n    - Set ticket to `hold` awaiting employee to report if troubleshooting steps helped \n    - When employee reaches again with update on the same ticket\n        - If troubleshooting steps helped -> mark as `resolved_by_requester`\n        - If troubleshooting steps NOT helped AND it is hardware failure (not turning on, no image, buttons don''t work, touchpad doesn''t work) -> Proceed with replacement as hardware failure \n        - Else - Escalate to IT Operations\n\n4. If it is Docking Station / Headset / Mouse / Keyboard issue \n    - Search knowledge base for relevant troubleshooting article\n    - Provide recommended troubleshooting steps to employee\n    - Set ticket to `hold` awaiting employee to report if troubleshooting steps helped \n    - When employee reaches again with update on the same ticket\n        - If troubleshooting steps helped -> mark as `resolved_by_requester`\n        - If troubleshooting steps NOT helped -> Proceed with new device provision\n\n5. If it is Office Wi-Fi connection issue impacting only one employee\n    - Provide recommended troubleshooting steps to employee (Section Wi-Fi/VPN Issues impacting individual employee: Troubleshooting Steps)\n    - Set ticket to `hold` awaiting employee to report if troubleshooting steps helped \n    - When employee reaches again with update on the same ticket\n        - If troubleshooting steps helped -> mark as `resolved_by_requester`\n        - If troubleshooting steps NOT helped -> Escalate to IT Operations\n\n6. If it is VPN Connection issue impacting only one employee\n    - Provide recommended troubleshooting steps to employee (Section Wi-Fi/VPN Issues impacting individual employee: Troubleshooting Steps)\n    - Set ticket to `hold` awaiting employee to report if troubleshooting steps helped \n    - When employee reaches again with update on the same ticket\n        - If troubleshooting steps helped -> mark as `resolved_by_requester`\n        - If troubleshooting steps NOT helped -> Escalate to IT Infrastructure \n\n### 8.2. **Wi-Fi/VPN Issues impacting individual employee: Troubleshooting Steps**\n\nTroubleshooting Steps for Office Wi-Fi Issues impacting only one employee \n- Can''t connect to Wi-Fi: 1. Verify correct network (VDB-Corporate, not VDB-Guest) 2. Forget network and reconnect 3. Restart laptop\n- Connected but no internet: 1. Try different website \n- Slow Wi-Fi: 1. Move closer to access point 2. Check for interference \n\nRemote Employee Internet Issues: Advise to contact internet service provider\n\nVPN Connection Failures:\n- VPN won''t connect: 1. Verify VPN client is latest version 2. Check internet connectivity 3. Try disconnecting/reconnecting 4. Restart VPN client 5. Reboot laptop \n- VPN connects but no access: 1. Verify VPN profile is correct 2. Check if specific system is down 3. Try accessing different internal resources\n- VPN slow/dropping: 1. Check home internet speed 2. Try wired connection instead of Wi-Fi 3. Close bandwidth-heavy applications \n- VPN certificate error: Likely expired certificate → Escalate to IT Infrastructure'
      - name: hardware_provision_and_replacement.md
        snippets:
          - '## 9. **Key Process (Intent): Hardware Provision and Replacement**\n\nFor obvious physical damage to the device (employee reports drop, cracked screen, liquid spill, etc.), do not perform troubleshooting steps from Section 8.1. Proceed directly to the replacement procedure in Section 9.2 with replacement_reason = damage and the applicable approval requirements.\n\nIf Laptop, Monitor, Docking Station, Headset, Mouse, or Keyboard doesn''t work, troubleshooting guidance (section Employee infrastructure troubleshooting) should be provided before initiating replacement\n\n### 9.1. **Employee role, type, and status limitations**\n\nFollowing categories of employees can not request Hardware Provision or Replacement\n\nLaptop Replacement\n- Departing Employee - if their existing laptop is functional (replacement reason can not be "refresh")\n\nMonitor Provision and Replacement, Docking station Provision\n- Departing Employee\n- Employee that is Contractor\n- Employee belonging to Customer Support AND their role contains "Agent"\n- Employee with role that contains "Receptionist"\n\nAccessories (Headset, Mouse, Keyboard, Monitor cables, laptop chargers, USB Type A, USB Type C, and Micro-USB cables) Provision\n- No limitations (available for all categories of employees)\n\n### 9.2. **Replacement Reasons for Laptops and Monitors**\n\n| Replacement reason | Keywords (as reported by employee) |\n|--------------------|------------------------------------|\n| "damage" | "dropped", "cracked", "water damage", "spilled", "lost", "stolen", "physical damage", "broken screen" |\n| "hardware_failure" | "not turning on", "won''t boot", "no power", "black screen", "no display", "won''t charge", "hardware failure", "keyboard stopped working", "trackpad stopped working" |\n| "refresh" | "upgrade", "faster", "too old" |\n\nIf employee''s description contains keywords from several categories -> Use the FIRST matching category (damage takes precedence over other ones, hardware_failure takes precedence over refresh) \n\nIf no keywords match: replacement_reason = "refresh"\n\n### 9.2.1. **Laptop Refresh and Replacement**\n\n**Step 1: Calculate Device Age**\n\nCalculate the device age using the formula: **device_age_months = FLOOR( (current_date − device.purchase_date) ÷ 30 )**, where\n    - device.purchase_date = from asset management system (device record)\n    - FLOOR = round down to nearest whole number\n\nExample: If device.purchase_date = 2023-06-15, and today is 2025-12-01, then Days difference = 900 days; device_age_months = FLOOR(900 ÷ 30) = 30 months\n\n**Step 2: Determine Target Device Tier**\n\n- If Employee requests a MacBook, "Mac", or "premium" OR Employee is Executive & Leadership -> The requested tier is "Premium"\n- Else the requested tier is "Standard"\n\nPremium tier applies only when the employee explicitly requests MacBook, Mac, or premium, OR the employee is Executive & Leadership. Phrases such as «more powerful laptop» or «better performance» without these keywords do not trigger Premium tier; use Standard tier.   \n\n**Step 3: Apply Replacement Decision**\n\n**If requested tier is "Premium" AND employee is not Executive & Leadership:**\n    - Business justification and Manager approval are required regardless of replacement reason and device age (overrides step 3)\n\n**If the replacement reason is "refresh":**\n    - If device age is less than 36 months, business justification and Manager approval are required. \n    - If device age is 36+ months, auto-approve the replacement. No approval needed. No business justification required.\n\nNote: Business justification must explain a specific business need (e.g., performance issues affecting productivity, compatibility requirements for new software). \n\n**If the replacement reason is "hardware_failure":**\n    - If device age is less than 12 months, auto-approve as a warranty replacement. Initiate a warranty claim.\n    - If device age is 12+ months, auto-approve the replacement due to hardware failure.\n\n**If the replacement reason is "damage":**\n    - Always require Manager approval regardless of device age. \n\n### 9.3. **Monitor Eligibility**\n\n**Check if request should be auto-approved**\n\nEmployees receive monitors with auto-approval if at least one following criteria is valid \n- Previously provided monitor has to be replaced due to hardware failure\n- Employee is Executive & Leadership\n- Employee is in a technical role AND office location is not "remote" AND currently has zero monitors\n    Note: If employee role contains any of the following: "Developer", "Engineer", "DevOps", "SRE", "DBA", "Database Administrator", or "Data Engineer", then employee is in a technical role.\n- Employee''s office location is "remote" AND currently has zero monitors\n\nAll other requests: business justification and Manager approval are required\n\n### 9.4. **Docking Station Eligibility**\n\n**Check if request should be auto-approved**\n\nEmployees receive docking stations with auto-approval if at least one criteria is valid\n- Employee is Executive & Leadership\n- Employee''s office location is "remote" AND currently has zero docking stations\n\nAll other requests: business justification and Manager approval are required\n\n### 9.5. **Accessories Eligibility**\n\nNote: Accessories are for employees with monitors or laptops provided by the company. It is forbidden to take accessories to use with personal devices.\n\nAccessories available on request:\n- Headset, Keyboard, Mouse: Auto-approved \n\nAccessories available in the local IT office during office working hours on a walk-in base (no need to request or approve):\n- Monitor cables, laptop chargers\n- USB Type A, USB Type C, and Micro-USB cables\n\nAn employee request for an item available on a walk-in basis (no request or approval required) is treated as informational: ticket type question, priority low, resolution_category information_provided. Inform the employee where and when the item can be obtained. Escalation and provisioning are not required.\n\n### 9.6. **Inventory Check Workflow**\n\nIf request for laptop, monitor, docking station, or accessories was approved or auto-approved\n    \n    1. Check inventory at employee''s office location (SF, NYC, Austin) or `remote_ship` for remote employees\n    2. If at least one device model within given category is available in inventory → assign from stock\n    3. If not available → create procurement order\n    4. When replacing an already assigned device (replacement), before or after assigning the new device, call retire_device for the old device to initiate the return process.\n\nNote: In case a procurement order for a laptop was created due to Hardware failure or Damage, agent should notify employee that they may ask for a temporary device \n\n### 9.7. **Device models choice**\n\nIf employee stated any preferences (except Windows/Mac/MacBook/Apple/Standard/Premium) \n    - If these preferences can be met within given category (e.g. "I''d like to get Lenovo" for a Standard Laptop; there is Lenovo Standard laptop model, and it is in stock) -> Select the first model in order from the Device model list (in the order specified in the policy) that matches preferences AND has an available asset in inventory \n    - Else Select the first model in order from the Device model list (in the order specified in the policy) for the given category that has an available asset in inventory. Consider only models that appear in the Device model list; do not offer or assign models not listed. \n        - If no models within given category are available in inventory -> Order first model within given category\n\nNote: If the replacement reason is "refresh" AND only the same Device Model is available (e.g. Executive asks for a newer MacBook model, current device is MacBook Pro 14, and only available MacBook is MacBook Pro 14) -> inform the employee that only the same models are available and ask them if they want to proceed. Put on ''hold'' until their answer \n\nLimitations: \n- Do not propose models that are not listed. \n- Employees cannot request devices categories that are not listed (e.g. external microphone) -> Deny \n- Employees cannot request a specific device model that is not listed -> Treat as request with no preferences\n    \n**Device model list:**\n\n| Device category | Device Models |\n|-------------|---------------|\n| Laptop Standard | Lenovo ThinkBook 14+, Dell Latitude 5440 |\n| Laptop Premium: employee requested Mac/MacBook/Apple or did not state any preferences | MacBook Pro 14 |\n| Laptop Premium: employee requested Windows | Lenovo ThinkPad X1 |\n| Docking Station | Lenovo 40A90090US, Lemorele Mejora 2025, CalDigit TS4 |\n| Monitor | Dell P2425H 24", Amazon Basics 24", ASUS VA24DQFS 24", Dell S2725HSM 27" |\n| Headset | Logitech H650e; Logitech Zone Wired 2|\n| Mouse | Logitech POP Wireless, HP 705 Rechargeable Wireless |\n| Keyboard | Logitech Media K200, HP 150 |\n| Monitor cables, laptop chargers, USB Type A, USB Type C, and Micro-USB cables | - (not specified due to no difference between models) |\n\n**Procurement Lead Times:**\n\nLaptops, Monitors - 10 business days\nAccessories (docking station, headset) - 5 business days\n\n### 9.8. **Device Return**\n\nWhen assigning replacement devices, retire the old device to initiate return process.\n\n**Status inquiry on in-flight hardware or procurement request:** For status inquiries on an in-flight hardware or procurement request: check for existing procurement orders, provide delivery status and timelines to the employee, do not create duplicate orders. Update ticket status per Section 2.5 (e.g. open or hold) as appropriate.\n\n**Hardware requests requiring business justification and approval:** If the employee has not provided business justification in the initial request, ask for it before creating approval requests. Keep ticket status open (or hold per Section 2.5 if waiting for the employee to respond) until
            justification is provided.'
      - name: license_management.md
        snippets:
          - '## 6. **Key Process (Intent): License Management**\n\nFor software requiring licenses (Tableau Creator, Figma, specialized tools named by requester), follow this decision process:\n\nStep 1. Determine what type of license pool the software uses:\n- Unlimited: License pool has no limit (e.g., Slack, Google Workspace)\n- Standard/Enterprise: Limited license pool shared across the company\n- Individual: Requires individual purchase for each user\n\nIf Software not found in license inventory -> Deny\n\nStep 2. Based on the license type and availability:\n\n**If the license type is "unlimited":**\n- Licenses are always available -> Allocate\n\n**If the license type is "standard" or "enterprise":**\n- Check how many licenses are available in the pool.\n- If the available count is null, this indicates an unlimited pool -> Allocate\n- If the available count is greater than zero, licenses are available -> Allocate\n- If the available count is zero (pool exhausted), inform the employee that no licenses are currently available. Offer to add to waitlist\n    - If employee agrees, set ticket as `pending` and `backlogged`\n    - Else Deny \n\n**If the license type is "individual" (requires purchase):**\n- This software requires a new license purchase. Approval depends on the annual cost.\n    - If the cost is $500 or less, only Manager approval is required.\n    - If the cost is more than $500, both Manager approval and Director approval are required.\n- Create an approval request with type `license_purchase` and set ticket as `pending`.'
      - name: password_mfa_account_access.md
        snippets:
          - '## 5. **Key Process (Intent): Password, MFA & Account Access Issues**\n\n### 5.1. **Identity Verification:**\n- **For IT Security, IT Operations, Product & Engineering, Compliance & Risk, HR, Finance & Accounting:** Use manager email confirmation for identity verification. Use video call only if manager email confirmation cannot be obtained (e.g. manager on leave).\n- **For Executive & Leadership:** Use EA or admin assistant email confirmation for identity verification. Use direct callback to known number only if email confirmation cannot be obtained.\n- **For all other employees:** Use employee email confirmation (confirm identity via the same email used for the request). Use SMS verification only if email confirmation is not possible.\n\nDo not offer the employee a choice of verification method. Use only the method specified above for their segment. Do not switch to video call, SMS, or callback because the employee prefers it or says it is more convenient. If the employee requests a different method, use the policy-defined method and explain that it is required.\n\n### 5.2. **Password Reset Requests:**\n\n| Scenario | Action |\n|----------|--------|\n| Employee forgot Okta password | Recommend to use Okta self-service reset (okta.vdb.com/reset). If self-service fails, trigger password reset |\n| Employee locked out (too many failed attempts) | Escalate to IT Operations |\n| Password expired | Recommend to use self-service password change (okta.vdb.com/reset); no actions needed unless locked out (if so -> Proceed with "locked out") |\n| Suspected compromised password | 1. Perform identity verification per Section 5.1. 2. Invalidate all active sessions for the user (invalidate_all_sessions). 3. Initiate password reset. 4. Notify IT Security (email). 5. Resolve the ticket as provisioned after completing immediate actions; formal escalation (changing owner, setting pending) is not required — IT Security will follow up as needed. Suspected compromised password for a single employee with no confirmed breach or broader impact is classified as SEV4. |\n\nIf issue persists - Escalate to IT Operations \n\n### 5.3. **MFA (Multi-Factor Authentication) Issues:**\n\nIf MFA device lost/stolen\n- Initiate identity verification\n- Invalidate all sessions\n- Remove lost/stolen MFA device\n- Notify IT Security\n- Escalate to IT Operations\n\nIf MFA not working (e.g. codes rejected) AND employee having issue is not Executive & Leadership\n- Check time sync on device, verify correct authenticator app is used\n- If issue persists - Escalate to IT Operations \n\nIf MFA not working (e.g. codes rejected) AND employee having issue is Executive & Leadership\n- If contacted by EA/admin assistant: Provide temporary bypass (max 4 hours) with IT Security notification\n- Else Initiate identity verification, Escalate to IT Operations\n\nIf New phone, need to transfer MFA\n- Initiate identity verification \n- Escalate to IT Operations\n\nIf MFA required but not enrolled\n- Guide through enrollment process, treat as Informational request (`question`)\n\n**Temporary MFA Bypass:**\n- Requires IT Security team approval (except SEV1/SEV2 incidents or Executive & Leadership requests)\n- Maximum duration: 4 hours\n- Must be documented in ticket with business justification\n- Employee must complete MFA re-enrollment before bypass expires\n\n### 5.4. **Account Lockout Resolution:**\n\n1. Check lockout reason in Okta admin logs\n2. If failed password attempts: Treat as Employee locked out (Password Reset Requests section)\n3. If suspicious activity detected: Escalate to IT Security team, do NOT unlock \n4. If compliance hold: Escalate to IT Compliance team, do NOT unlock'
      - name: security_and_incident_response.md
        snippets:
          - '## 10. **Key Process (Intent): Security and Incident Response**\n\nA request for production access in the context of an active incident (Section 10) is recorded as a problem (access request) ticket, not an incident. The incident context is captured in incident_severity and customer_impact fields. For employees with «Temp only (SEV1/2)» eligibility, access under Section 10 is permitted only when there is an active SEV1 or SEV2 incident. For SEV3/SEV4 incidents or when no active incident exists — deny access. For contractors (Section 3.3), Group 4/5 access restrictions remain; during incidents the Section 10 procedure for contractors applies (e.g. SEV3 workflow) unless otherwise stated.\n\nAll incidents are traced in Internal Security Incident Management system as security incidents. \n\n### 10.1. **Incident Severity Classification**\n\n| Severity | Criteria | Customer Impact |\n|----------|----------|-----------------|\n| SEV1 — Critical | Customer-facing service completely down; payment processing failure; login/auth down; data breach | All or most customers affected (>50% of active users) |\n| SEV2 — High | Service degradation affecting >10% of transactions or users; feature partially broken; response times >5x normal | Many customers (10-50%) OR majority of employees (>50%) |\n| SEV3 — Medium | Internal system/infrastructure issues affecting productivity; minor feature bug affecting <10% of customers; performance degradation <5x normal | Internal teams or small customer group (<10%) |\n| SEV4 — Low | Minor bug, cosmetic issue, single user issue, no business impact | Minimal, isolated (single user or <1% of users) |\n\n### 10.2. **Incident Response Access Procedures**\n\nAlways check that incident is still active (not closed) before access provision\n\n**If the incident severity is SEV1 (Critical):**\n    - Grant access to Sensitivity Group 5 tools (except Splunk SIEM (user)) immediately without waiting for approval.\n    - After granting access, send post-facto notifications to Manager and IT Security team\n    \n    Note: this section cannot be applied to Contractors, for Contractors follow the procedure for SEV3 (Medium). \n\n**If the incident severity is SEV2 (High):**\n    - Fast-track the approval process for Sensitivity Group 5 tools (except Splunk SIEM (user))\n    - Manager approval is required, but can be obtained by requester verbally or via Slack.\n        - If Manager approval is obtained (even verbally), grant production access immediately. \n        - If Manager approval is not yet obtained, create an approval request and set ticket status to `pending`.\n    - After granting access, send post-facto notifications to Manager and IT Security team\n    \n    Note: this section cannot be applied to Contractors, for Contractors follow the procedure for SEV3 (Medium). \n\n**If the incident severity is SEV3 (Medium):**\n    - Standard approval process applies.\n    - Require Manager approval through standard approval workflow (Create an approval request and wait for approval before granting access)\n\n**If the incident severity is SEV4 (Low):**\n    - Follow the normal access request workflow (Section "Access to Tools").\n    - No expedited handling.\n\n**SEV1/SEV2/SEV3/SEV4 Access Rules:**\n    - All incident access is temporary and provided for 24 hours.\n    - Extension requires new justification and fresh approval.\n    - If an employee received an access to one system or tool, and then asks to provide an access to another system or tool within the same incident, new justification and fresh approval should be requested. \n\n### 10.3. **Breaking Glass Override (When Normal Approvers are Unavailable)**\n\nIf the incident severity is SEV1 or SEV2 AND incident is still active (not closed) AND requester states that the required approver is unavailable (on leave, unreachable):\n    - Grant temporary access immediately.\n    - Provoide access for 24 hours.\n    - Document as "Breaking glass procedure invoked — approver unavailable."\n    - After granting access, send post-facto notifications to Manager, skip-level Manager (Level 6+) and IT Security team\n\n### 10.4. **Security Incident Handling**\n\nFor security incidents (suspected breach, unauthorized access, malware): IT Security team approval required for investigation access'
      - name: software_installation.md
        snippets:
          - '## 7. **Key Process (Intent): Software Installation**\n\n### 7.1. **Software Requests to be Escalated or Denied**\n\n| Request Type | Action |\n|--------------|--------|\n| Personal software (games, entertainment) | Deny |\n| Unlicensed/pirated software | Deny |\n| Software with known security vulnerabilities | Deny |\n| Custom/internal development tools | Escalate to Product & Engineering team |\n| Software requiring server-side components | Escalate to IT Infrastructure team |\n| IT Security tools | Escalate to IT Operations |\n| Unapproved/unknown software | Escalate to IT Security |\n\n### 7.2. **Installation Workflow:**\n\n1. If software is not approved (approved software list is available as KB article) -> Proceed with section "Software Requests to be Escalated or Denied"\n\n2. If license required -> follow Section "License Management"\n\n3. If software is approved AND license is provided or not requied, proceed with installation: \n   - For Slack, Zoom, Google Chrome, Microsoft Office, Tableau, VPN Client, 1Password -> Recommend self-service installation via Okta App Catalog\n   - Any other software -> Escalate to IT Operations\n\n### 7.3. **Software Troubleshooting**\n\nFor software issues (crashes, errors, update failures):\n\n1. Search KB for known issues and fixes\n2. Provide troubleshooting steps: \n   - Restart the application\n   - Check for updates (Help → Check for Updates)\n   - Restart laptop\n   - Clear application cache (if applicable)\n3. If issue persists: Escalate to IT Operations'
