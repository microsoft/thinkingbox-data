    sources:
      - name: billing_payment_operations.md
        snippets:
          - "## 9. Billing & Payment Operations\n\n### 9.1 Payment Arrangements\n\nPayment arrangements help customers who are behind on payments avoid policy cancellation. Payment arrangements always take effect today.\n\n### 9.2 Arrangement Types\n\n**Extension:**\n- Provides 10 additional days to pay\n- New due date = current date + 10 days\n- Customer phrases: \"more time\", \"extension\", \"push back the date\", \"few more days\"\n\n**Installment Plan:**\n- Splits past-due balance into 2-3 payments\n- If past-due amount <= 2× monthly payment: 2 installments\n- If past-due amount > 2× monthly payment: 3 installments\n- Customer phrases: \"split\", \"payment plan\", \"installments\", \"multiple payments\"\n\n### 9.3 Eligibility Requirements\n\n**Account status eligibility**:\n\n| Account Status | Eligible |\n|----------------|----------|\n| Current | No – arrangement not needed |\n| Past Due | Yes |\n| In Grace Period | Yes |\n| Pending Cancellation | Yes |\n| Cancelled | No – too late |\n| Lapsed | No – too late |\n\n**In Grace Period**: Policy is past the due date but coverage is still active (typically 1-30 days overdue).\n\n+ See Customer Tier section for additional prerequisites\n\n### 9.4 Arrangement Limits\n\nCheck arrangements granted in past 12 months against tier limit (see Customer Tier Framework). If limit reached, decline request.\n\n### 9.5 Major Claim Impact\n\nIf the policy has an open claim with Major severity, apply tier restrictions (see Customer Tier Framework).\n\n### 9.6 Installment Plan Additional Requirements\n\nInstallment plans require:\n- Past-due amount > 1.5× monthly payment amount\n\nSee Customer Tier Framework for more details.\n\nIf requirements not met but customer qualifies for extension, offer extension instead. Proceed with extension if customer agrees.\n\n---"
      - name: claims_operations.md
        snippets:
          - "## 6. Claims Operations\n\n### 6.1 First Notice of Loss (FNOL)\n\nFNOL is the process of creating a new claim when a customer reports an incident.\n\n### 6.2 Required Information\n\nGather the following from the customer:\n\n| Information | Required | Notes |\n|-------------|----------|-------|\n| Policy Number | Yes | Validate against policy records |\n| Date of Loss | Yes | When the incident occurred |\n| Loss Location | Yes | City, state, or specific address |\n| Loss Description | Yes | What happened – determines claim type |\n| Vehicle Involved | If multiple on policy | Year/make/model or VIN |\n| Driver at Time of Loss | For collision claims | Who was driving |\n| Other Party Information | For multi-vehicle accidents | Name, phone, insurance if available |\n| Police Report Number | If applicable | Required for certain loss types |\n| Injuries | Yes | Whether anyone was hurt |\n\n+ see Customer Tier Framework section for pre-requisites \n\n### 6.3 Policy Status Validation\n\nBefore creating a claim, verify the policy was active on the date of loss:\n\n**Invalid statuses (no claim can be created):**\n- Cancelled for Non-Payment\n- Lapsed\n- Non-Renewed\n\nIf the policy was not active on the date of loss, no coverage exists for this incident.\n\n### 6.4 Loss Type Classification\n\nDetermine claim type based on the customer's description:\n\n**Collision Claims** (requires collision coverage):\n| Subtype | Customer Description |\n|---------|---------------------|\n| Multi-Vehicle | \"other driver\", \"two cars\", \"rear-ended\", \"T-boned\" |\n| Single Vehicle | \"hit a pole\", \"lost control\", \"went off road\", \"single car\" |\n| Hit and Run | \"hit and run\", \"they drove off\", \"other driver left\", \"didn't stop\" |\n| Parked Vehicle | \"parked\", \"someone hit my parked car\", \"found damage\" |\n\n**Priority Rule:** If a loss fits multiple descriptions (e.g., a Parked Vehicle and Hit and Run), use **Parked Vehicle** as the classification.\n\n**Comprehensive Claims** (requires comprehensive coverage):\n| Subtype | Customer Description |\n|---------|---------------------|\n| Theft | \"stolen\", \"theft\", \"car was taken\" |\n| Vandalism | \"vandalism\", \"keyed\", \"broken into\", \"smashed\" |\n| Weather | \"hail\", \"storm\", \"flood\", \"tree fell\", \"weather\" |\n| Fire | \"fire\", \"burned\" |\n| Animal Strike | \"deer\", \"animal\", \"hit an animal\" |\n| Glass Only | \"windshield\", \"glass\", \"window cracked\" |\n\n**Liability Only:**\n- Customer has no collision or comprehensive coverage but wants to report for liability purposes\n- Only applicable when vehicle lacks the required coverage for the loss type\n\n### 6.5 Coverage Verification\n\nAfter determining claim type, verify the vehicle has appropriate coverage.\n\nIf required coverage is not present, their policy does not cover this type of loss.\n\n### 6.6 Police Report Requirements\n\nCertain loss types require a police report. Details available in Zendesk Knowledge Base.\n\n### 6.7 Claim Severity\n\nSet severity based on claim characteristics:\n\n| Severity | Criteria |\n|----------|----------|\n| Minor | Glass-only claims |\n| Major | Customer mentions injury, hospitalization, or states vehicle is a total loss |\n| Moderate | All other claims |\n\n### 6.8 SIU (Special Investigations Unit) Triggers\n\nFlag the claim for SIU review if ANY of the following are true:\n\n1. Customer profile has fraud flag\n2. Policy has 3 or more claims in the past 24 months\n3. Theft claim and vehicle is 15+ years old\n4. Theft claim and vehicle was added to policy within the last 30 days\n\nIf SIU flag is set, the claim is created but internal review is required.\n\n### 6.9 Unlisted Driver Flag\n\nIf the driver at the time of loss is not found in the policy's driver list, set the unlisted driver flag on the claim. This does not prevent claim creation but is recorded for investigation.\n\n---"
      - name: customer_tier_framework.md
        snippets:
          - "## 4. Customer Tier Framework\n\n### 4.1 Tier Definitions\n\nCustomers are classified into three tiers based on their history and risk profile:\n\n| Tier | Description |\n|------|-------------|\n| Standard | Base tier, standard eligibility, most restrictions |\n| Preferred | Good customer history, fewer restrictions, additional benefits |\n| Premium | Excellent history, fewest restrictions, maximum flexibility |\n\n### 4.2 Payment Arrangement Limits\n\nThe number of payment arrangements (extensions or installment plans) a customer can receive is limited by tier. Search Zendesk Knowledge Base for more details.\n\n### 4.3 Policy Reinstatement Windows\n\nAfter a policy is cancelled for non-payment, reinstatement is available for a limited time. Search Zendesk Knowledge Base for more details.\n\n### 4.4 DUI/DWI Handling\n\nWhen adding a driver with a DUI or DWI within the past 5 years:\n\n| Tier | Action |\n|------|--------|\n| Standard | **Decline** – Cannot add driver with recent DUI |\n| Preferred | **Add with Underwriting Review** – Driver is added but flagged for UW review |\n| Premium | **Add with Underwriting Review** – Driver is added but flagged for UW review |\n\n### 4.5 Major Claim Impact on Billing Arrangements\n\nWhen a policy has an open major-severity claim:\n\n| Tier | Extension Allowed | Installment Plan Allowed |\n|------|-------------------|-------------------------|\n| Standard | No | No |\n| Preferred | Yes | No |\n| Premium | Yes | Yes |\n\n---"
      - name: document_services.md
        snippets:
          - "## 11. Document Services\n\n### 11.1 Document Requests\n\nCustomers may request instant access to policy documents. These requests should be handled immediately by generating a secure access link. This link must be provided directly to the customer in the current chat session. The generated link expiration date must be set to 24 hours from the current date & time.\n\n### 11.2 Eligible Documents\n\nThe following documents can be generated on-demand and shared via link:\n- **Proof of Insurance**: Standard ID card verification.\n- **Declarations Page**: Detailed coverage limits and premiums.\n- **ID Card**: Wallet-sized proof of coverage.\n\n---"
      - name: policy_lifecycle_management.md
        snippets:
          - "## 10. Policy Lifecycle Management\n\n### 10.1 Policy Cancellation (Customer Requested)\n\n#### 10.1.1 Eligibility Requirements\n\n**Policy status**: Cannot already be in Cancelled for Non-Payment or Lapsed status\n+ See Customer Tier section for additional prerequisites\n\n#### 10.1.2 Requested Information\n\n| Information | Required |\n|-------------|----------|\n| Policy Number | Yes |\n| Requested Cancellation Date | Yes |\n| Reason for Cancellation | Optional |\n\n#### 10.1.3 Effective Date Calculation\n\nApply state notice requirements (see relevant States Section):\n\n1. Determine minimum allowed cancellation date\n\n2. Compare customer's requested date to minimum:\n   - If requested date >= minimum: Use requested date\n   - If requested date < minimum: Use minimum allowed date\n\n---\n\n### 10.2 Policy Reinstatement\n\n#### 10.2.1 Eligibility Requirements\n\n**Policy status**: Must be Cancelled for Non-Payment or Lapsed\n+ See Customer Tier section for additional prerequisites\n\n#### 10.2.2 Reinstatement Window\n\nCheck if within reinstatement window based on tier (Customer Tier section):\n\n1. Calculate days since cancellation: today minus cancellation date\n2. Get maximum window for tier\n3. If days since cancellation > window: Cannot reinstate\n\n#### 10.2.3 Payment Verification\n\nReinstatement requires full past-due amount to be paid. Check billing records to confirm payment has been received.\n\nIf payment not received, inform customer they must pay the outstanding balance before reinstatement can be processed.\n\n#### 10.2.4 Lapse Recording\n\nIf reinstating after the original cancellation date has passed:\n- Lapse flag = TRUE\n- Lapse period = cancellation date through today\n- This gap in coverage is recorded on the policy history\n\nIf reinstating before the cancellation date (policy still technically active):\n- Lapse flag = FALSE\n- No gap recorded\n\n---"
      - name: policy_servicing_drivers.md
        snippets:
          - "## 8. Policy Servicing – Drivers\n\n### 8.1 Add Driver\n\n#### 8.1.1 Eligibility Requirements\n\n**Policy status**: Must be Active or In Grace Period\n+ see Customer Tier Framework section\n\n#### 8.1.2 Required Information\n\n| Information | Required |\n|-------------|----------|\n| Policy Number | Yes |\n| Driver Full Name | Yes |\n| Driver Date of Birth | Yes |\n| License Number | If licensed |\n| License State | If licensed |\n| Relationship to Insured | Yes |\n| Accidents/Violations (past 5 years) | Yes |\n| DUI/DWI History | Yes |\n\n#### 8.1.3 Licensed vs. Unlicensed Drivers\n\nDetermine license status from customer's statements:\n- **Licensed**: Customer provides valid license number and state\n- **Unlicensed**: Customer indicates no license, permit only, suspended, or revoked\n\nFor unlicensed drivers, state rules determine handling (see State Regulatory Requirements section)\n\n#### 8.1.4 DUI/DWI Rules\n\nIf driver has DUI or DWI within the past 5 years, apply tier-based rules (see Customer Tier Framework section).\n\n#### 8.1.5 Violation Count Rules\n\nCount violations from customer's explicit statement:\n\n| Customer Statement | Violation Count |\n|-------------------|-----------------|\n| \"No\", \"none\", \"clean record\" | 0 |\n| \"One ticket\", \"one accident\", \"a speeding ticket\" | 1 |\n| \"Two tickets\", \"a couple\" | 2 |\n| \"Three\", \"several\", \"a few\" | 3 |\n| \"Four or more\", \"multiple\", \"many\" | 4+ |\n\n**If violations >= 3**: Underwriting review required regardless of tier.\n\n#### 8.1.6 Exclusion Form\n\nWhen adding a driver as excluded, inform the customer that a signed exclusion form is required and use appropriate flag.\n\n#### 8.1.7 Effective Date\n\nDriver additions always take effect today.\n\n---\n\n### 8.2 Remove Driver\n\n**Policy status**: Must be Active or In Grace Period\n+ see Customer Tier Framework section\n\n#### 8.2.2 Driver Identification\n\nMatch driver by name. If ambiguous (multiple similar names), ask for clarification.\n\n#### 8.2.3 Named/Co-Insured Restriction\n\nInformation about this is available in Zendesk Knowledge Base.\n\n#### 8.2.4 Open Claim Restriction\n\nA driver who is listed as the driver at time of loss on an open claim cannot be removed until the claim closes.\n\n#### 8.2.5 Effective Date\n\nDriver removals always take effect today.\n\n#### 8.2.6 Status Update\n\nSuccessful removal will update the driver's status to 'Removed'. The driver record remains on the policy history.\n\n---"
      - name: policy_servicing_vehicles.md
        snippets:
          - "## 7. Policy Servicing – Vehicles\n\n### 7.1 Add Vehicle\n\nBefore adding a vehicle, verify **Policy status**: Must be Active or In Grace Period\n+ see Customer Tier Framework section\n\n#### 7.1.2 Required Information\n\n| Information | Required |\n|-------------|----------|\n| Policy Number | Yes |\n| Vehicle VIN | Yes |\n| Year | Yes |\n| Make | Yes |\n| Model | Yes |\n| Date Acquired | Yes |\n\nValid VIN must be provided. If VIN is invalid, request correction once from customer. If still invalid - do not proceed.\n\n#### 7.1.3 Excluded Vehicles\n\nCertain vehicles cannot be added to personal auto policies. Details about excluded makes, models, and conditions are available in Zendesk Knowledge Base.\n\n#### 7.1.4 High-Risk Vehicle Classifications\n\nSome vehicles trigger underwriting review for Standard tier customers:\n\n**High-Value Luxury Vehicles:**\n- Porsche (all models)\n- BMW M3, M4, M5, M8\n- Mercedes-Benz AMG models\n- Audi RS3, RS5, RS6, RS7\n- Tesla Model S Plaid\n- Maserati (all models)\n- Jaguar F-Type\n- Land Rover Range Rover (full-size only)\n\n**Sports Car Class:**\n- Chevrolet Corvette (base models, not Z06/ZR1)\n- Ford Mustang GT\n- Chevrolet Camaro SS, ZL1\n- Dodge Challenger R/T, Scat Pack\n- Nissan Z models\n- Toyota Supra\n- Mazda MX-5 Miata\n- Subaru WRX STI\n\n#### 7.1.5 Effective Date Calculation\n\n1. Determine if within automatic extension window:\n   - Calculate: today minus date acquired\n   - Compare to policy's automatic extension days\n\n2. Apply state backdating rules (see State Regulatory Requirements section)\n\n#### 7.1.6 Underwriting Triggers\n\nFlag for UW review if:\n- Policy has 2 or more at-fault claims in past 3 years\n\n---\n\n### 7.2 Remove Vehicle\n\n#### 7.2.1 Eligibility Requirements\n\n**Policy status**: Must be Active or In Grace Period\n+ see Customer Tier Framework section\n\n#### 7.2.2 Vehicle Identification\n\nCustomer may identify vehicle by:\n- Exact VIN\n- Year + Make + Model (if only one match exists)\n\nIf description is ambiguous (multiple vehicles match), ask customer to clarify.\n\n#### 7.2.3 Only Vehicle Restriction\n\nIf the vehicle being removed is the only vehicle on the policy, it cannot be removed. The customer must cancel the policy instead. Inform them of this requirement and redirect to cancellation if they wish to proceed.\n\n#### 7.2.4 Open Claim Restriction\n\nInformation about claim stages and when removal is allowed is available in Zendesk Knowledge Base. \n\n#### 7.2.5 Effective Date\n\nNo backdating is allowed.\n\n#### 7.2.6 Status Update\n\nSuccessful removal will update the vehicle's status to 'Removed'. The vehicle record remains on the policy history.\n\n---"
      - name: state_regulatory_requirements.md
        snippets:
          - "## 3. State Regulatory Requirements\n\n### 3.1 Overview\n\nState regulations affect several key business processes. This section consolidates all state-specific rules. When processing a request, identify the policy's state and apply the corresponding rules.\n\n### 3.2 Effective Date & Backdating Rules\n\nBackdating refers to setting an effective date in the past (before today).\n\n| State | Backdating Policy |\n|-------|-------------------|\n| California (CA) | **Prohibited.** Effective date must be today or future. |\n| New York (NY) | **Prohibited.** Effective date must be today or future. |\n| Texas (TX) | **Allowed** within automatic extension window for qualifying events. |\n| Florida (FL) | **Allowed** within automatic extension window for qualifying events. |\n\n**Automatic Extension Window:** Each policy has information about automatic extension days. \n\n### 3.3 Driver Exclusion Rules\n\nDriver exclusion allows an unlicensed or high-risk driver to be listed on the policy as \"Excluded\" rather than rated, meaning they are prohibited from driving any vehicle on the policy.\n\n| State | Exclusions Allowed | Requirements |\n|-------|-------------------|--------------|\n| California (CA) | **No** | All household drivers must be rated |\n| New York (NY) | **No** | All household drivers must be rated |\n| Texas (TX) | **Yes** | Signed exclusion form required |\n| Florida (FL) | **Yes** | Signed exclusion form required |\n\n**Treatment of Drivers Who Cannot Be Rated:**\n- In CA/NY: Cannot add as excluded. Must either rate the driver (if possible) or decline the request. If a household member cannot be rated (e.g. customer refusal), the policy update cannot be processed.\n- In TX/FL: Can add as excluded. Exclusion form is required.\n\n### 3.4 Policy Cancellation Notice Requirements\n\nSearch Zendesk Knowledge Base for specific details.\n\n---"
