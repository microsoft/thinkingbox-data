  sandbox_external_retail:
    sources:
      - name: Customer Segmentation and Tiers.md
        snippets:
          - "## 1. CUSTOMER SEGMENTATION\n\n### 1.1 Customer Tiers\n\nTechHome Direct operates three customer tiers that affect return windows, fee waivers, shipping benefits, and service levels:\n\n**Standard Customers:** No membership fee, baseline policies apply\n\n**TechHome Plus Members:** Annual membership ($79/year), enhanced benefits\n\n**VIP Customers:** Automatically granted based on lifetime value, premium benefits\n\n**Finding Customer Tier:**\nYou can check the customer's tier in their customer profile (`customer_tier` field). This determines which policies apply.\n\n### 1.2 Customer Scoring Categories\n\nCustomer scores (0-100) work alongside tiers to determine fee waivers, compensation amounts, and service levels:\n\n**Regular Customers:** Score 70-100\n**Opportunist Customers:** Score 40-69  \n**Bonus Hunter Customers:** Score 0-39\n\n**Finding Customer Score:**\nYou can check the customer's score in their customer profile (`customer_score` field). Remember: NEVER disclose or hint at scores to customers.\n\n### 1.3 First-Time Customer Courtesy\n\n**Rule:** Customers with `total_orders = 1` experiencing an issue on their first purchase receive automatic waiver of restocking fees regardless of tier or score."
      - name: Order Status and Tracking.md
        snippets:
          - "## 3. ORDER STATUS & TRACKING\n\n### 3.1 Order Status Flow\n\nOrders progress: `pending_payment` → `processing` → `shipped` → `installation_scheduled` OR `delivered`\n\nAlternative terminal status: `cancelled`\n\n### 3.2 Order Status Response Guidance\n\n**`pending_payment`:**\n- Payment authorization incomplete\n- You can check payment status for specific issue\n- IF payment status is `declined` or `failed`: Guide customer to update payment method\n- IF payment status is `pending_authorization`: Inform customer payment processing typically completes within 1-2 hours\n\n**`processing`:**\n- Payment confirmed, preparing for shipment\n- Ships within 1-2 days\n- Cannot provide specific ship date until status changes\n\n**`shipped`:**\n- Order in transit\n- You can retrieve tracking information to provide carrier details and estimated delivery\n\n**`installation_scheduled`:**\n- Major appliance delivered, awaiting installation\n- You can retrieve installation job details for scheduled date\n\n**`delivered`:**\n- Carrier marked as delivered\n- If customer claims non-receipt: follow undelivered package workflow\n\n### 3.3 Tracking Status Workflows\n\n**`in_transit`:** Standard progress, no action if within expected window\n\n**`delayed`:** \n- Carrier-reported delay\n- **IF** order total > $500 AND delay > 5 days past estimated delivery date:\n  - Regular customers: Offer 10% partial refund\n  - Opportunist customers: Offer 5% partial refund\n  - Bonus hunter customers: Provide information only, no compensation\n- If you create refund, use reason `late_delivery_compensation`\n\n**`exception`:**\n- Delivery exception (weather, address issues, access problems)\n- Customer must wait for carrier resolution\n- **IF** current date > 7 days past estimated delivery date AND status still `exception`: Treat as delayed delivery, apply compensation if eligible (see delayed workflow)\n\n**`delivered` but not received:**\n- First verify: customer checked with neighbors, household members, alternate locations\n- You can check: order shipping address, customer tier, customer score\n\n**Decision tree:**\n\nVIP customers receive a courtesy replacement regardless of their score. Regular customers (score 70 or above) who are not VIP also receive a courtesy replacement. For Opportunist and Bonus Hunter customers, initiate a carrier investigation, which takes 3-5 days.\n\n**For courtesy replacements:**\n\nYou can check inventory for each SKU from the original order. Process each item in the order as follows:\n\nWhen the item is in stock (available_quantity > 0), create a replacement order. Use expedited shipping for VIP customers and standard shipping for all other customers.\n\nIf the item is out of stock but has a restock date within the next 14 days, offer the customer a choice between waiting for the restock or receiving a refund immediately. If the customer chooses a refund, create a manual refund (see manual refunds section for undelivered package refunds).\n\nFor items with no restock date or a restock date exceeding 14 days, create a manual refund using reason `order_cancelled` with the amount set to the line item final_price (see manual refunds section for undelivered package refunds). \n\n**`returned_to_sender`:**\n\nWhen a package is marked as undeliverable, ask the customer what address they intended for shipment. You can check the order shipping address and compare the customer's intended address with the shipping address on record.\n\nIf the addresses don't match, this indicates a customer error at checkout. Call reship_order with customer_fault=true, which will return the reship_cost. Charge the customer this reship cost using reason `reship_fee`.\n\nIf the addresses match, the package was undeliverable for other reasons. Call reship_order with customer_fault=false, and no charge applies to the customer."
      - name: Returns and Exchanges.md
        snippets:
          - "## 4. RETURNS & EXCHANGES\n\n### 4.1 Return Order Status Eligibility\n\n**Returns apply to:**\n- Orders with status `installation_scheduled` (appliance delivered, installation not yet performed)\n- Orders with status `delivered` (everything complete)\n\n**Other statuses use different processes:**\n- `pending_payment` or `processing`: Use cancellation workflow\n- `shipped`: Customer must wait for delivery, set ticket to `hold`\n- `cancelled`: Order already cancelled, cannot return\n\n### 4.2 Return Eligibility Verification\n\n**Return window determination:**\nSearch Zendesk knowledge base for return window policies to find:\n- Base return window for customer tier\n- Special rules for defective items\n- Refurbished product restrictions\n\n**Special rule for Standard customers:**\nProducts in categories `computing`, `gaming`, or `wearables` have return window = 50% of standard window when returned for non-defect reasons.\n\n**Eligibility decision:**\n\nWhen the days since delivery fall within the applicable return window, the item is eligible for return. If the days since delivery exceed the return window but the item is defective, check warranty coverage (see warranty section). For all other cases, the item is not eligible and no resolution is available. \n\n### 4.3 Return Fee Calculation\n\n**Base refund amount:** Start with line item final price (price after purchase discounts)\n\n**Calculate fees:**\n\n**Restocking Fee:**\n- Applies ONLY to non-defect returns of opened items by Standard customers\n- Search Zendesk knowledge base for restocking fee percentage\n- **Waive if:** customer total orders = 1 (first-time courtesy) OR customer score >= 70\n- **Never applies if:** item unopened OR item is defective OR customer tier is `plus_member` or `vip`\n- Formula: restocking_fee = 0 OR (line item final price × percentage from Zendesk KB)\n\n**Return Shipping Cost:**\n- Applies to non-defect returns by Standard customers for items under 30 pounds (small items)\n- Search Zendesk knowledge base for return shipping cost amount\n- **Never applies if:** product weight in lbs >= 30 OR product is defective OR customer tier is `plus_member` or `vip`\n- Formula: return shipping cost = 0 OR amount from Zendesk KB\n\n**Removal Fee:**\n- Applies to non-defect returns of installed major appliances for Standard customers\n- Search Zendesk knowledge base for removal fee amount\n- **Only applies if:** order status = `delivered` AND order installation service id exists AND installation_job status = `completed`\n- **Never applies if:** installation not completed OR is defective OR customer tier is `plus_member` or `vip`\n- Formula: removal_fee = 0 OR amount_from_KB\n\n**Final refund calculation for each item:**\n```\nrefund_amount = final_price - restocking_fee - return_shipping_cost - removal_fee\n```\n\n**Note:** If order was paid partially/fully with points, RMA system automatically splits refund between cash and points. You don't need to calculate this split.\n\n### 4.4 Processing Returns\n\n**REQUIREMENT:** You MUST create RMA with create_rma tool.\n\n**Required fields:**\n- `order_id`: Order identifier\n- `line_item_id`: Specific line item being returned (only 1 for specific RMA)\n- `customer_id`: Customer identifier\n- `return_reason`: Map customer's description to enum value\n- `is_defective`: Boolean flag\n- `refund_amount`: Your calculated final refund\n- `restocking_fee`: Your calculated restocking fee (or 0)\n- `return_shipping_cost`: Your calculated return shipping cost (or 0)\n- `removal_fee`: Your calculated removal fee (or 0)\n\n**Return reason mapping:**\n- Customer describes product defect → `defective`\n- Customer describes shipping damage → `damaged_in_transit`\n- Customer received wrong product → `wrong_item_received`\n- Customer changed mind / buyer's remorse → `changed_mind`\n- Product doesn't match expectations → `not_as_expected`\n\n**RMA processing:**\n- RMA initiates return process\n- System automatically triggers refund when warehouse receives returned item\n- Refund timeline: 7-10 days for Standard/Plus, 2-3 days for VIP\n- Drop ship orders (fulfillment_type = `drop_ship`): 3-4 weeks processing\n\n**Special case - Installation service:**\n**IF** installation service id exists AND order status = `installation_scheduled`:\n- You MUST also cancel installation job\n- Use cancellation_reason = `customer_cancelled_order`\n- Do NOT create separate refund for installation - RMA handles automatically\n\n### 4.5 Multi-Item Returns\n\n**When customer returns multiple line items in same request:**\n- You MUST create separate RMA for each line item\n- Apply return shipping cost to FIRST RMA only (lowest line_item_id numerically)\n- Set return shipping cost = 0 for all subsequent RMAs\n\n### 4.6 Exchanges\n\n**Exchange conditions:**\n- Customer wants same SKU to replace defective item\n- Different SKU requires return + new order created by customer (not exchange)\n- Drop ship orders (fulfillment_type = `drop_ship`): No exchanges supported, return only\n\n**Exchange workflow:**\n\nTo process an exchange, first verify return eligibility according to the return eligibility section. You can check inventory for specific SKU.\n\nWhen the item is in stock (available quantity > 0), create an RMA for record-keeping purposes — note that no actual refund will be issued. Then create a replacement order using the same SKU and shipping address from the original order. Apply standard shipping for Standard and Plus customers, or expedited shipping for VIP customers.\n\nIf the item is currently out of stock but has a restock date within the next 14 days, offer the customer a choice between waiting for the item to become available or proceed with return immediately.\n\nFor items with no restock date or a restock date exceeding 14 days, proceed with a return."
      - name: Product Defects and Warranty.md
        snippets:
          - "## 5. PRODUCT DEFECTS & WARRANTY\n\n### 5.1 Defect Resolution Routing\n\n**Decision tree:**\n\nYou can check the days since delivery and warranty coverage period to determine the appropriate resolution path.\n\nWhen the issue falls within the applicable return window, process it as a return (see returns section). If the issue is outside the return window but still within the warranty coverage period, process a warranty claim. For issues outside both the return window and warranty coverage, no resolution is available through TechHome Direct.\n\n### 5.2 Warranty Claims\n\n**Applicability:** Defective products outside return window with active warranty coverage. Verify warranty is still active.\n\n**Warranty types:**\n- `manufacturer`: Standard manufacturer warranty, no accidental damage coverage\n- `extended_warranty`: Purchased extended warranty, no accidental damage coverage  \n- `protection_plan`: Includes accidental damage coverage\n\nSearch Zendesk knowledge base for warranty coverage period details by product category.\n\n**Warranty issue mapping:**\n- Product completely non-functional → `product_not_functioning`\n- Specific part failed → `component_failed`\n- Works but performs poorly → `performance_degradation`\n- Accidental damage (drops, spills, etc) → `accidental_damage` (ONLY valid if warranty_type = `protection_plan`)\n\n**Next step:** File the warranty claim, if the customer is eligible for it. \n\n**After filing:**\n- Provide claim_id to customer\n- Inform customer: Warranty department will contact within 2-3 days\n\n### 5.3 Minor Defect Partial Refunds\n\n**When to offer:**\nCustomer reports issue AND ALL of these are true:\n- Issue is: small cosmetic scratch OR small cosmetic dent OR missing non-essential accessory (cables, manuals, remote control)\n- Product core functionality works properly\n- Customer explicitly wants to keep item despite issue\n\n**Do NOT offer if:**\n- Product has functional issues → Route to return or warranty\n- Customer wants to return → Route to return process\n- Issue is safety-related → Route to return or warranty\n\n**Partial refund calculation:**\nYou can check customer_score to determine percentage:\n- Regular customers: 20% of line item final price\n- Opportunist customers: 10% of line item final price\n- Bonus hunter customers: 5% of line item final price\n\n**Workflow:**\n\nCalculate the partial refund amount and offer it to the customer as an alternative to returning the item.\n\nIf the customer accepts the partial refund, create a refund with reason `partial_refund_minor_defect`. If the customer declines the offer, process a full return according to the returns section."
      - name: Installation Services.md
        snippets:
          - "## 6. INSTALLATION SERVICES\n\n### 6.1 Service Overview\n\nInstallation services apply to:\n- Major appliances: refrigerators, washers, dryers, dishwashers\n- TV wall mounting\n\nSearch Zendesk knowledge base for:\n- Service pricing\n- What's included in basic vs advanced installation\n- Workmanship warranty duration and coverage\n\n### 6.2 Scheduling\n\n**For customer-requested reschedules:**\n1. Confirm new desired date with customer\n2. Use reschedule_installation tool with reschedule_reason = `customer_request`\n\n**For company-caused delays:**\n- Use reschedule_reason = `technician_unavailable` OR `weather_delay`\n- **IF** delay > 7 days from original scheduled date:\n  - You can check customer_score for compensation:\n  - Regular customers (70-100): 10% refund of service cost\n  - Opportunist customers (40-69): 5% refund of service cost\n  - Bonus hunter customers (0-39): No compensation\n  - Create refund with reason `late_delivery_compensation`\n\n### 6.3 Workmanship Warranty Issues\n\n**When customer reports installation problems:**\n\nYou can check:\n- Installation job to retrieve information\n- Verify: installation job status = `completed` AND current date <= workmanship warranty end\n\nSearch Zendesk knowledge base for workmanship warranty coverage details.\n\n**IF within warranty period AND issue is installation-related:**\n- Installation errors, leaks, improper connections, installation-caused damage qualify\n- Reschedule installation with reschedule reason = `workmanship_issue`\n- Free corrective service\n\n**IF issue is product defect (not installation-related):**\n- Route to product defect processes (see warranty section)\n\n### 6.4 Installation Cancellation\n\n**Eligibility check:**\nYou can retrieve installation job details and verify:\n- installation job status NOT `in_progress` or `completed`\n- IF in_progress or completed: Cannot cancel\n\n**Cancellation process:**\n1. Explain to customer: Cancelling refunds installation service cost but requires payment of standard shipping cost\n2. Search Zendesk knowledge base for shipping cost for major appliances\n3. **IF** customer confirms cancellation:\n   - Cancel installation, reason = `customer_wants_ship_only`\n   - Create refund with reason = `order_cancelled`, amount = installation job service cost\n   - Charge customer with reason = `installation_cancelled_shipping`, amount = shipping cost from Zendesk KB"
      - name: Payment and Discount Disputes.md
        snippets:
          - "## 7. PAYMENT & DISCOUNT DISPUTES\n\n### 7.1 Discount System Overview\n\nTechHome Direct offers:\n1. Percentage discount codes (SAVE20, FALL15)\n2. BOGO/bundle promotions\n3. Reward points redemption (Plus members only)\n4. Loyalty pricing (Plus member exclusive pricing)\n5. Seasonal/clearance sales\n\nSearch Zendesk knowledge base for:\n- Stacking rules\n- Points redemption restrictions\n\nSystem applies stacking rules automatically. When discounts cannot stack, system typically applies larger discount.\n\n### 7.2 Discount Dispute Resolution\n\n**Information you can gather:**\n- Order details\n- Discount application record \n- Promotion details \n- Product details\n\n**Dispute scenarios:**\n\n**Non-stackable discounts:**\n- Check: promotion stackable_with_points = false OR promotion stackable_with_loyalty = false\n- Explain: Stacking policy (search KB for details)\n- Verify: System applied larger discount\n- No refund if system correctly applied larger discount\n\n**Restricted products:**\n- Check: product points_redemption_eligible = false\n- Explain: Specific restriction (search Zendesk KB for details)\n- No refund if product correctly restricted\n\n**System errors:**\n- Verify: Promotion was valid\n- Verify: SKU not in promotion excluded Skus\n- **IF** valid promotion should have applied but didn't:\n  - Calculate discount shortfall\n  - Create refund with reason `discount_correction`\n\n**Loyalty + points combination:**\n- Loyalty pricing CAN stack with points (search Zendesk KB to confirm)\n- **IF** both should have applied but didn't:\n  - Calculate discount shortfall\n  - Create refund with reason `discount_correction`\n\n### 7.3 Payment Failures\n\n**You can check payment status:**\n- `declined`: Card declined by bank → Guide customer to contact bank or cancel order for new order\n- `failed`: Processing error → Offer cancellation for new order\n- `pending_authorization`: Still processing\n- `authorized`: Payment successful\n\n**IF payment status = `pending_authorization` for > 2 hours:**\n- Inform customer: Processing typically completes within 2 hours but taking longer\n- Recommend: Wait another hour, contact back if still pending\n- Set ticket to `pending`"
      - name: Order Modifications.md
        snippets:
          - "## 8. ORDER MODIFICATIONS\n\n### 8.1 Order Cancellation\n\n**Cancellation eligibility by status:**\n- `pending_payment` or `processing`: Eligible, full refund, no fees\n- `shipped`, `installation_scheduled`, `delivered`, `cancelled`: NOT eligible\n\n**For ineligible statuses:**\n- `shipped`: Order in transit, cannot cancel. Customer must wait for delivery then use return process\n- `installation_scheduled` or `delivered`: Use return process\n- `cancelled`: Already cancelled\n\n**Cancellation workflow:**\n\n**IF order.status = `pending_payment`:**\n- Use cancel_order with cancellation_reason = `customer_request`\n- No refund needed (payment not captured)\n\n**IF order.status = `processing`:**\n- Use cancel_order with cancellation_reason = `customer_request`\n- System automatically issues full refund\n\n**Special case - Order with installation service:**\n**IF** order installation service id exists AND order status is `pending_payment` or `processing`:\n1. First: Cancel installation, reason = `customer_cancelled_order`\n2. Then: Cancel order, reason = `customer_request`\n3. Order cancellation automatically refunds full amount (appliance + installation)\n4. No separate installation refund needed\n5. No shipping charge (order being cancelled)\n\n### 8.2 Modification Windows\n\n**Eligibility for address/shipping speed changes:**\n- Order must be placed within 2 hours (order_date >= current_date - 2 hours)\n- Order status must be `processing`\n- **IF** outside window OR wrong status: Cannot modify\n\n**Address changes:**\n**CRITICAL:** Copy customer-provided address EXACTLY as stated.\n\n**IF eligible:**\n- Update order address with exact customer-provided address components\n\n**IF not eligible and not yet shipped:**\n- Offer cancellation if desired by the customer and cancel the order\n\n### 8.3 Promo Codes After Purchase\n\n**Rule:** Promo codes cannot be applied retroactively.\n\n**IF** customer forgot valid code:\n- Offer cancellation IF within cancellation window (see cancellation eligibility). The customer will be able to re-order using promo code after that\n- Otherwise: No adjustment available"
      - name: Refunds.md
        snippets:
          - "## 9. REFUNDS\n\n### 9.1 Automatic Refunds\n\n**DO NOT manually create refunds for these scenarios** (system handles automatically):\n\n**Product returns via RMA:**\n- When you create RMA, system automatically triggers refund after warehouse receives item\n- Refund includes calculated refund_amount from RMA\n- System handles cash/points split automatically\n\n**Order cancellations:**\n- When cancel order for `processing` status orders, system automatically issues full refund if payment captured\n- No manual refund needed\n\n### 9.2 Manual Refunds\n\n**You MUST manually create refunds for these scenarios:**\n\n**Installation service refunds:**\n- When: Customer cancels installation service (not entire order)\n- Reason: `order_cancelled`\n- Amount: installation job service cost\n\n**Discount corrections:**\n- When: Valid promotions should have applied but didn't\n- Reason: `discount_correction`\n- Amount: Calculate discount shortfall based on promotion rules\n\n**Minor defect compensation:**\n- When: Customer keeps item with minor defect\n- Reason: `partial_refund_minor_defect`\n- Amount: Based on customer score (see minor defect section)\n\n**Late delivery compensation:**\n- When: Orders > $500 with delays > 5 days\n- Reason: `late_delivery_compensation`\n- Amount: Based on customer score (see tracking issues section)\n\n**Undelivered package refunds:**\n- When: Package marked delivered but not received, courtesy replacement cannot be provided (item out of stock with no restock or restock >14 days)\n- Reason: `order_cancelled`\n- Amount: Line item final price for the item that cannot be replaced\n\n**REQUIREMENT:** Create refund with correct reason and calculated amount."
      - name: Membership Management.md
        snippets:
          - "## 10. MEMBERSHIP MANAGEMENT\n\n### 10.1 Plus Membership Benefits\n\nAnnual cost: $79/year\n\nSearch Zendesk knowledge base for complete benefit list.\n\n### 10.2 Membership Upgrades\n\n**Eligibility check:**\n\nCustomers are eligible for an upgrade when no membership record exists or when the membership status is `cancelled`. Customers with an active membership status are not eligible, as they already have an active membership.\n\n**Upgrade process:**\n- Update membership status with appropriate action, membership_type = `plus`\n- System creates new membership record (1-year validity, active status)\n- System charges $79 membership fee\n- System automatically updates customer_tier (can take several hours)\n\n### 10.3 Membership Cancellations\n\n**Eligibility check:**\n- **IF** membership status = `active`: Eligible for cancellation\n- **ELSE**: No active membership to cancel\n\n**Cancellation process:**\n- Update membership status with appropriate action\n- System updates status to `cancelled` (can take several hours)\n- Points balance retained in record but no new points earned on future purchases\n\n### 10.4 Points Balance Inquiries\n\n**When customer asks about points balance:**\n1. Retrieve membership details (includes points_balance)\n2. Inform customer of current balance"
