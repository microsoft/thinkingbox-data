name: Test ThinkingBox Tools

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'servers/thinkingbox_tools/**'
      - '.github/workflows/test-thinkingbox-tools.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: 3.12
        enable-cache: true

    - name: Install dependencies
      working-directory: ./servers/thinkingbox_tools
      run: |
        uv sync --group dev

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install pyodide worker (Node deps + vendored PyPI wheels)
      working-directory: ./servers/thinkingbox_tools/thinkingbox_tools/toolslib/sandbox
      run: npm ci

    - name: Run tests with pytest
      working-directory: ./servers/thinkingbox_tools
      run: |
        uv run pytest -m "not typesense" --verbose
