name: Test ThinkingBox Tools

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'servers/thinkingbox_tools/**'
      - '.github/workflows/test-thinkingbox-tools.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        python-version: 3.12
        enable-cache: true

    - name: Install dependencies
      working-directory: ./servers/thinkingbox_tools
      run: |
        uv sync --group dev

    - name: Run tests with pytest
      working-directory: ./servers/thinkingbox_tools
      run: |
        uv run pytest -m "not typesense" --verbose
