name: Test ThinkingBox Tools

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'servers/thinkingbox_tools/**'
      - '.github/workflows/test-thinkingbox-tools.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: 3.12
        enable-cache: true

    - name: Install dependencies
      working-directory: ./servers/thinkingbox_tools
      run: |
        uv sync --group dev

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Install pyodide worker (Node deps + vendored PyPI wheels)
      working-directory: ./servers/thinkingbox_tools/thinkingbox_tools/toolslib/sandbox
      run: npm ci

    - name: Run tests with pytest
      working-directory: ./servers/thinkingbox_tools
      run: |
        uv run pytest -m "not typesense" --verbose
