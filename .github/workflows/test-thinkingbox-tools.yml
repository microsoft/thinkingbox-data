name: Test ThinkingBox Tools

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'servers/thinkingbox_tools/**'
      - '.github/workflows/test-thinkingbox-tools.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: 3.12
        enable-cache: true

    - name: Install dependencies
      working-directory: ./servers/thinkingbox_tools
      run: |
        uv sync --group dev

    - name: Run tests with pytest
      working-directory: ./servers/thinkingbox_tools
      run: |
        uv run pytest -m "not typesense" --verbose
