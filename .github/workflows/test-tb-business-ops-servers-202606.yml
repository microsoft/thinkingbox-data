name: Test TB Business Ops Servers 202606

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'servers/tb_business_ops_servers_202606/**'
      - '.github/workflows/test-tb-business-ops-servers-202606.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: 3.12
        enable-cache: true

    - name: Install dependencies
      working-directory: ./servers/tb_business_ops_servers_202606
      run: |
        uv sync --group dev

    - name: Run tests with pytest
      working-directory: ./servers/tb_business_ops_servers_202606
      run: |
        uv run pytest -m "not tb_mcp_start" tests/ --verbose
